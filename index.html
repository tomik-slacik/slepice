<link href="https://fonts.googleapis.com/css2?family=Rye&family=Bitter:wght@600;700;800&family=Karla:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#E8DCC3; --surface:#F6F0E3; --surface-2:#EFE4CB;
    --ink:#241B14; --ink-soft:#5B4A38; --line:#CDBB93;
    --accent:#C4471F; --accent-text:#9A371A; --yolk:#DDA13B;
    --shadow:#CDBB93; --feather:#A66A3B; --sage:#748253;
  }
  *,*::before,*::after{box-sizing:border-box;}
  html,body{margin:0;padding:0;min-height:100vh;min-height:100dvh;}
  body{
    background:var(--bg);color:var(--ink);
    font-family:'Karla',-apple-system,'Segoe UI',sans-serif;line-height:1.5;
    -webkit-tap-highlight-color:transparent;
    overscroll-behavior-y:contain;
  }
  img,svg{display:block;max-width:100%;}
  .mono{font-family:'IBM Plex Mono','SFMono-Regular',Consolas,monospace;}
  input,button{font:inherit;}

  #shell{
    max-width:480px;margin:0 auto;min-height:100vh;min-height:100dvh;
    display:flex;flex-direction:column;background:var(--bg);position:relative;
  }

  /* ---------- onboarding ---------- */
  #view-onboarding{flex:1;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top,0px) + 26px) 22px 24px;gap:18px;}

  /* ---------- splash ---------- */
  #view-splash{
    flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:18px;padding:24px;text-align:center;cursor:pointer;user-select:none;
  }
  .splash-word{font-family:'Rye',serif;font-size:52px;color:var(--accent-text);line-height:1;}
  .splash-tag{font-size:13.5px;color:var(--ink-soft);max-width:260px;}
  .splash-hint{
    position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);
    font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.08em;
    text-transform:uppercase;color:var(--ink-soft);opacity:.7;
  }
  @keyframes splash-hint-pulse{0%,100%{opacity:.4;}50%{opacity:.9;}}
  .splash-hint{animation:splash-hint-pulse 2.2s ease-in-out infinite;}
  @media (prefers-reduced-motion: reduce){ .splash-hint{animation:none;opacity:.7;} }
  .topbar{display:flex;align-items:center;justify-content:space-between;}
  .icon-btn{color:var(--ink);cursor:pointer;padding:4px;}
  .app-eyebrow{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent-text);}
  .app-h1{font-family:'Bitter',serif;font-weight:800;font-size:25px;text-wrap:balance;}
  .app-sub{font-size:13.5px;color:var(--ink-soft);line-height:1.5;}

  .card{background:var(--surface);border:1px solid var(--line);border-radius:4px;box-shadow:2px 2px 0 var(--shadow);padding:16px;}
  .pressable{cursor:pointer;transition:transform .08s ease;user-select:none;}
  .pressable:active{transform:translate(1px,1px);}

  .btn-primary{
    background:var(--accent);color:var(--surface);border-radius:4px;box-shadow:2px 2px 0 var(--shadow);
    padding:16px;text-align:center;font-family:'Bitter',serif;font-weight:700;font-size:15.5px;
    display:flex;align-items:center;justify-content:center;gap:8px;border:none;width:100%;
  }
  .btn-secondary{
    background:transparent;color:var(--ink-soft);text-align:center;font-family:'IBM Plex Mono',monospace;
    font-size:12px;padding:10px;
  }

  .field-label{font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:8px;}
  .name-input{font-family:'Bitter',serif;font-weight:700;font-size:19px;color:var(--ink);background:transparent;border:none;border-bottom:2px solid var(--line);padding:8px 2px;width:100%;outline:none;}
  .name-input:focus{border-bottom-color:var(--accent);}
  .text-input{font-family:'Karla',sans-serif;font-size:14px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:11px 12px;width:100%;outline:none;}
  .text-input:focus{border-color:var(--accent);}
  .rename-input{font-family:'Bitter',serif;font-weight:700;font-size:16.5px;color:var(--ink);background:transparent;border:none;border-bottom:2px solid var(--line);padding:4px 2px;outline:none;}
  .rename-input:focus{border-bottom-color:var(--accent);}

  .farm-card{display:flex;align-items:center;justify-content:space-between;gap:10px;border:1.5px solid var(--line);border-radius:4px;box-shadow:2px 2px 0 var(--shadow);padding:13px 15px;background:var(--surface);}
  .farm-card[data-selected="true"]{border-color:var(--accent);background:var(--surface-2);}
  .farm-name{font-family:'Bitter',serif;font-weight:700;font-size:15px;}
  .farm-meta{font-size:12px;color:var(--ink-soft);margin-top:2px;}
  .check-circle{width:21px;height:21px;border-radius:50%;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:transparent;}
  .farm-card[data-selected="true"] .check-circle{background:var(--accent);border-color:var(--accent);color:var(--surface);}

  .amount-card{background:var(--surface);border:1px solid var(--line);border-radius:4px;box-shadow:3px 3px 0 var(--shadow);padding:18px 18px 14px;}
  .amount-display{display:flex;align-items:baseline;justify-content:center;gap:6px;}
  .amount-num{font-family:'Bitter',serif;font-weight:800;font-size:46px;color:var(--accent-text);font-variant-numeric:tabular-nums;line-height:1;}
  .amount-unit{font-family:'Bitter',serif;font-weight:700;font-size:16px;color:var(--ink-soft);}
  input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:6px;background:var(--line);border-radius:3px;outline:none;margin:14px 0 4px;}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;border-radius:50%;background:var(--accent);border:3px solid var(--surface);box-shadow:2px 2px 0 var(--shadow);cursor:pointer;}
  input[type=range]::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:var(--accent);border:3px solid var(--surface);box-shadow:2px 2px 0 var(--shadow);cursor:pointer;}
  input[type=range]::-moz-range-track{width:100%;height:6px;background:var(--line);border-radius:3px;}
  .range-ends{display:flex;justify-content:space-between;font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--ink-soft);}

  .reveal-panel{background:var(--surface);border-left:3px solid var(--accent);padding:13px 15px;box-shadow:2px 2px 0 var(--shadow);}
  .reveal-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:5px;gap:8px;}
  .reveal-top span{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--ink-soft);}
  .reveal-msg{font-size:13.5px;line-height:1.5;}

  .day-pill-row{display:flex;gap:5px;}
  .day-pill{flex:1;text-align:center;padding:8px 0;border-radius:4px;background:var(--surface);color:var(--ink-soft);border:1.5px solid var(--line);font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:600;}
  .day-pill[data-active="true"]{background:var(--accent);color:var(--surface);border-color:var(--accent);}
  .hint{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--ink-soft);margin-top:7px;min-height:14px;}

  .step-dots{display:flex;gap:5px;justify-content:center;}
  .step-dots span{width:6px;height:6px;border-radius:50%;background:var(--line);}

<script>
(function(){
  'use strict';

  // ============ constants ============
  var STORAGE_KEY = 'kvoc_app_state_v2';
  // real approximate town-center coordinates (demo-grade precision - fine
  // for "roughly how many km away", not a survey). Farms themselves are
  // still made up for this demo - see onboarding's location note - but the
  // distance math against them is real.
  // capacity is illustrative for this demo (no real backend booking against
  // it) - same numbers as kvoc-backend/app/seed.py so the two stay honest
  // twins of each other, not just coincidentally similar
  // animalOfferings mirrors kvoc-backend/app/seed.py's FarmAnimalOffering
  // rows, kept in sync by hand - same 3 farms offer the same combos there.
  var FARMS = [
    {key:'lipa',      name:'Farma U Lípy',      style:'volný výběh', town:'Sázava',      lat:49.8564, lng:14.8636, capacity:60, animalOfferings:[{species:'cow', product:'milk', capacity:25}]},
    {key:'dvur',      name:'Dvůr Na Kopci',     style:'bio chov',    town:'Benešov',     lat:49.7847, lng:14.6873, capacity:40, animalOfferings:[{species:'goat', product:'milk', capacity:20}]},
    {key:'polana',    name:'Polana Farm',       style:'volný výběh', town:'Neveklov',    lat:49.7994, lng:14.5589, capacity:80, animalOfferings:[]},
    {key:'ricany',    name:'Zahrada Pod Lesem', style:'bio chov',    town:'Říčany',      lat:49.9917, lng:14.6650, capacity:30, animalOfferings:[]},
    {key:'beroun',    name:'Farma Beránek',     style:'volný výběh', town:'Beroun',      lat:49.9639, lng:14.0725, capacity:50, animalOfferings:[]},
    {key:'kladno',    name:'Dvůr U Rybníka',    style:'bio chov',    town:'Kladno',      lat:50.1477, lng:14.1030, capacity:35, animalOfferings:[]},
    {key:'melnik',    name:'Vinný Dvůr',        style:'volný výběh', town:'Mělník',      lat:50.3520, lng:14.4739, capacity:45, animalOfferings:[]},
    {key:'kutnahora', name:'Stříbrná Farma',    style:'bio chov',    town:'Kutná Hora',  lat:49.9481, lng:15.2683, capacity:25, animalOfferings:[]}
  ];
  function farmMeta(f, distanceKm){
    var loc = distanceKm==null ? f.town : f.town+', '+distanceKm+' km';
    return f.style+' · '+loc+' · '+f.capacity+' volných míst';
  }

  // ============ other livestock (docs/LIVESTOCK.md) - simulated, no real
  // backend behind this offline demo, same "fictional but functional"
  // honesty as everything else here (farms, badges, gift voucher). Mirrors
  // kvoc-backend's Animal/MeatShare shape, generalized by species/product.
  var ANIMAL_PRODUCTS = {
    goat:  {milk: {unitLabel:'litrů mléka', kcPerUnit:25}},
    cow:   {milk: {unitLabel:'litrů mléka', kcPerUnit:22}}
    // sheep intentionally absent - no ongoing product anymore, meat-share
    // only (see MEAT_SHARES below). Wool was removed on purpose (would need
    // its own shearing/washing/spinning chain), mirrors kvoc-backend's
    // config.ANIMAL_PRODUCTS/docs/LIVESTOCK.md.
  };
  var ANIMAL_CARE_MESSAGES = [
    'se pásla na louce.', 'dostala čerstvé seno.', 'se napila z napajedla.',
    'si hověla ve stínu.', 'dostala kartáčování.', 'si protáhla nohy na dvoře.'
  ];
  function speciesLabel(species){ return {goat:'Koza', sheep:'Ovce', cow:'Kráva'}[species] || species; }
  function freshAnimal(id, species, product, name, farmKey, dailyAmount, address){
    return {
      id:id, species:species, product:product, name:name, farm:farmKey, dailyAmount:dailyAmount, address:address,
      paused:false, productLog:{}, deliveries:[], pausedDates:{}
    };
  }
  // Haversine - distance in km between two lat/lng points
  function distanceKm(lat1, lng1, lat2, lng2){
    var R = 6371, toRad = Math.PI/180;
    var dLat = (lat2-lat1)*toRad, dLng = (lng2-lng1)*toRad;
    var a = Math.sin(dLat/2)*Math.sin(dLat/2) +
      Math.cos(lat1*toRad)*Math.cos(lat2*toRad)*Math.sin(dLng/2)*Math.sin(dLng/2);
    return Math.round(R * 2*Math.atan2(Math.sqrt(a), Math.sqrt(1-a)));
  }
  var FEED_MESSAGES = [
    'dostala ranní zrníčko.',
    'se napila studánkové vody.',
    'se vyhřívala na sluníčku a hrabala se v hlíně.',
    'si pochutnala na tučném červíkovi.',
    'si protáhla křídla na dvorku.',
    'si hověla v čerstvé podestýlce.',
    'se proháněla po dvorku za motýlem.'
  ];
  var DAY_LABELS = ['NE','PO','ÚT','ST','ČT','PÁ','SO'];

  // ============ state — a list of independent hens ============
  function freshHen(id, henName, farm, dailyAmount, address){
    return {
      id: id, henName: henName, farm: farm, dailyAmount: dailyAmount, address: address,
      paused: false, feedLog: {}, deliveries: [], pausedDates: {}, bestStreak: 0,
      // high-water mark of dailyAmount, same idea as bestStreak - an
      // accessory unlocked by reaching a higher daily amount once stays
      // unlocked even if the amount is later turned back down
      bestDailyAmount: dailyAmount
    };
  }

  // ============ hen accessories - a little extra reason to raise the daily
  // amount beyond "more eggs": each tier dresses the hen up a bit more.
  // Cumulative and permanent (based on bestDailyAmount, never taken away).
  // tiers sit above DEFAULT_DAILY_AMOUNT (20) on purpose - a fresh hen never
  // starts with an accessory already unlocked, so there's always a real "pay
  // a bit more and get something for it" moment. +5 -> glasses, +10 -> hat,
  // max (+20) -> a bonus one for going all the way.
  var ACCESSORY_TIERS = [
    {id:'glasses', min:25, label:'brýle',  unlock: function(n){ return n+' dostala brýle! Teď vypadá mnohem chytřeji.'; }},
    {id:'hat',     min:30, label:'čepici', unlock: function(n){ return n+' dostala čepici — bude ji hřát i v zimě.'; }},
    {id:'scarf',   min:40, label:'šátek',  unlock: function(n){ return n+' dostala parádní šátek. Teď je nastrojená naplno!'; }}
  ];
  function henAccessories(hen){
    var mark = hen.bestDailyAmount || hen.dailyAmount;
    return ACCESSORY_TIERS.filter(function(t){ return mark >= t.min; }).map(function(t){ return t.id; });
  }
  function nextAccessoryHint(hen){
    var mark = hen.bestDailyAmount || hen.dailyAmount;
    var next = ACCESSORY_TIERS.filter(function(t){ return mark < t.min; })[0];
    if(!next) return '';
    return 'Dalších '+(next.min-mark)+' Kč denně a '+hen.henName+' dostane '+next.label+'.';
  }

  var defaults = {
    onboarded: false, dayOffset: 0, activeTab: 'home', activeHenId: null,
    nextHenId: 1, hens: [],
    // which pet the Home screen (and its switcher) currently shows - can be
    // a hen or any other adopted animal. Independent from activeHenId
    // above, which Activity/Nastavení still use on their own (see
    // homeSwitcherHtml() vs the older henSwitcherHtml()).
    activePetKind: 'hen', activeAnimalId: null,
    animals: [], nextAnimalId: 1,
    // three demo meat shares, one per MEAT_SHARE_SPECIES so all three are
    // actually demonstrable - mirrors kvoc-backend/app/seed.py's _MEAT_SHARES
    // (same labels/prices). myShares/status/totalYieldKg only, since there
    // are no other real customers in a single-browser offline demo to show
    // a shared total for.
    meatShares: [
      {id:'cow',   label:'Kráva Bětka',  species:'cow',   totalShares:8, priceCzk:890, includesHide:true, myShares:0, status:'open', totalYieldKg:null},
      {id:'goat',  label:'Koza Šarlota', species:'goat',  totalShares:4, priceCzk:650, includesHide:true, myShares:0, status:'open', totalYieldKg:null},
      {id:'sheep', label:'Ovce Beruška', species:'sheep', totalShares:3, priceCzk:580, includesHide:true, myShares:0, status:'open', totalYieldKg:null}
    ]
  };
  var state = loadState();
  if(!state || !Array.isArray(state.hens)){ state = JSON.parse(JSON.stringify(defaults)); }

  var obStep = 1;
  var obMode = 'first';       // 'first' (very first hen) | 'add' (adding another)
  // Initialized with real defaults up front (not null) - renderOnboarding()
  // reads obDraft.* unconditionally, and the very first render for a brand
  // new visitor happens before startOnboarding() is ever called.
  var obDraft = {henName:'Nuška', farm:'lipa', dailyAmount:20, address:''};
  var showingOnboarding = false; // transient - lets "add a hen" reopen onboarding without touching state.onboarded
  var selDay = null;
  var actFilter = 'all';

  // farm-finder (onboarding step 1) - transient, never persisted, re-asked
  // fresh every time onboarding opens
  var geoStatus = 'idle';   // idle | asking | granted | denied | unsupported
  var userLoc = null;       // {lat, lng} once granted
  var farmRadius = 'all';   // 'all' | 10 | 25 | 50 (km)

  // Statek (other livestock) - transient UI state, never persisted
  var addAnimalOpen = false;
  var addAnimalDraft = {species:'', product:'', farmKey:'', dailyAmount:20, name:''};
  var shareSharesDraft = {}; // per-share id -> stepper count, lazily 1
  function shareDraft(id){ return shareSharesDraft[id] || 1; }

  // gift voucher - transient, not tied to any one hen, never persisted
  var giftOpen = false;
  var giftGenerated = false;
  var giftDraft = {recipient:'', gifter:'', amount:20, message:''};

  function loadState(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      if(!raw) return null;
      var parsed = JSON.parse(raw);
      var merged = Object.assign({}, defaults, parsed);
      // migrate the old singular cow-only meatShare (pre goat/sheep-share
      // update) onto the new meatShares array, so an in-progress demo
      // purchase from before this update isn't silently lost
      if(parsed.meatShare && !parsed.meatShares){
        merged.meatShares = defaults.meatShares.map(function(s){
          if(s.species === parsed.meatShare.species){
            return Object.assign({}, s, {
              myShares: parsed.meatShare.myShares,
              status: parsed.meatShare.status,
              totalYieldKg: parsed.meatShare.totalYieldKg
            });
          }
          return s;
        });
      }
      delete merged.meatShare;
      // prune any previously-adopted animal whose species/product no longer
      // exists (sheep/wool - meat-shares took over sheep, see
      // ANIMAL_PRODUCTS above) so nobody's Home screen is left showing a
      // ghost pet from before this update
      if(merged.animals && merged.animals.length){
        var keptIds = {};
        merged.animals = merged.animals.filter(function(a){
          var keep = !!((ANIMAL_PRODUCTS[a.species]||{})[a.product]);
          if(keep) keptIds[a.id] = true;
          return keep;
        });
        if(merged.activePetKind==='animal' && !keptIds[merged.activeAnimalId]){
          merged.activePetKind = 'hen';
        }
      }
      return merged;
    }catch(e){}
    return null;
  }
  function saveState(){ try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){} }

  function activeHen(){
    return state.hens.filter(function(h){ return h.id === state.activeHenId; })[0] || state.hens[0] || null;
  }
  function activeAnimal(){
    return state.animals.filter(function(a){ return a.id === state.activeAnimalId; })[0] || null;
  }

  // ============ date helpers ============
  function pad(n){ return n<10 ? '0'+n : ''+n; }
  function dateKey(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
  function getNow(){ return new Date(Date.now() + state.dayOffset*86400000); }
  function dateOnly(d){ return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
  function isWeekday(d){ var g=d.getDay(); return g>=1 && g<=5; }
  function mondayOf(d){
    var g=d.getDay(); var diff=(g===0)?-6:(1-g);
    var m=dateOnly(d); m.setDate(m.getDate()+diff); return m;
  }
  function fmtDateHuman(key){
    var parts=key.split('-'); return parts[2]+'.'+parts[1]+'.';
  }
  function fmtFull(d){
    var days=['neděle','pondělí','úterý','středa','čtvrtek','pátek','sobota'];
    return days[d.getDay()]+' '+d.getDate()+'.'+(d.getMonth()+1)+'.';
  }
  function eggsPreview(amount){ return Math.max(1, Math.round(amount*5/12.5)); }
  function farmName(key){ var f=FARMS.filter(function(x){return x.key===key;})[0]; return f? f.name+' · '+f.style : ''; }

  // ============ farm-finder: real device location, real distance math ============
  // Prefers the native Capacitor Geolocation plugin when running in the
  // wrapped app (proper Android permission dialog, more reliable than a
  // bare WebView geolocation call) - falls back to the standard browser
  // API everywhere else (this same file also runs as a plain page on
  // GitHub Pages, with no native plugin present at all).
  function requestLocation(){
    geoStatus = 'asking';
    renderOnboarding();
    var GeoPlugin = (window.Capacitor && Capacitor.isNativePlatform && Capacitor.isNativePlatform() && Capacitor.Plugins)
      ? Capacitor.Plugins.Geolocation : null;

    function onOk(lat, lng){ userLoc = {lat:lat, lng:lng}; geoStatus = 'granted'; renderOnboarding(); }
    function onErr(){ geoStatus = 'denied'; renderOnboarding(); }

    if (GeoPlugin) {
      GeoPlugin.checkPermissions().then(function(perm){
        var already = perm && (perm.location === 'granted' || perm.coarseLocation === 'granted');
        return already ? Promise.resolve() : GeoPlugin.requestPermissions();
      }).then(function(){
        return GeoPlugin.getCurrentPosition({enableHighAccuracy:false, timeout:10000});
      }).then(function(pos){
        onOk(pos.coords.latitude, pos.coords.longitude);
      }).catch(onErr);
    } else if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(function(pos){
        onOk(pos.coords.latitude, pos.coords.longitude);
      }, onErr, {enableHighAccuracy:false, timeout:10000});
    } else {
      geoStatus = 'unsupported';
      renderOnboarding();
    }
  }

  // farms sorted by distance (if we have a location) and narrowed to the
  // chosen radius; distance is null (and order stays as authored) until
  // requestLocation() actually succeeds
  function farmsForPicker(){
    var withDist = FARMS.map(function(f){
      var d = userLoc ? distanceKm(userLoc.lat, userLoc.lng, f.lat, f.lng) : null;
      return {farm:f, dist:d};
    });
    if (userLoc) {
      withDist.sort(function(a,b){ return a.dist - b.dist; });
      if (farmRadius !== 'all') withDist = withDist.filter(function(x){ return x.dist <= farmRadius; });
    }
    return withDist;
  }

  // ============ business logic (per hen) ============
  function tickHen(hen, today){
    var toasts = [];
    if(isWeekday(today)){
      var key = dateKey(today);
      if(hen.paused){
        hen.pausedDates[key] = true;
      } else if(!hen.feedLog[key]){
        var msg = FEED_MESSAGES[Math.floor(Math.random()*FEED_MESSAGES.length)];
        hen.feedLog[key] = {amount:hen.dailyAmount, msg:hen.henName+' '+msg, bonus:false, date:key};
        toasts.push({tag:'−'+hen.dailyAmount+' Kč', body:hen.feedLog[key].msg});

        if(Math.random() < 0.18){
          var bmsg = hen.henName+' má dobrý den — snesla vejce navíc. Přidáme ho do páteční bedýnky.';
          hen.feedLog[key+'-bonus'] = {amount:0, msg:bmsg, bonus:true, date:key};
          toasts.push({tag:'BONUS', body:bmsg});
        }

        if(today.getDay()===5){
          var mon = mondayOf(today);
          var weekAmount = 0;
          for(var i=0;i<5;i++){
            var dd = new Date(mon.getTime()+i*86400000);
            var k = dateKey(dd);
            if(hen.feedLog[k] && !hen.feedLog[k].bonus) weekAmount += hen.feedLog[k].amount;
          }
          var eggs = Math.max(1, Math.round(weekAmount/12.5));
          hen.deliveries.push({weekStart:dateKey(mon), eggs:eggs, amount:weekAmount, status:'transit', date:key});
          toasts.push({tag:'PÁTEK', body:'Tenhle týden jsi '+hen.henName+' krmil. Dnes odpoledne dorazí '+eggs+' vajec.'});
        }
      }
    }
    if(hen.deliveries.length){
      var last = hen.deliveries[hen.deliveries.length-1];
      if(last.status==='transit'){
        var fridayDate = dateOnly(new Date(last.date+'T00:00:00'));
        var daysSince = Math.round((dateOnly(today)-fridayDate)/86400000);
        if(daysSince >= 1){
          last.status='delivered';
          toasts.push({tag:'DORUČENO', body:last.eggs+' vajec právě dorazilo ke dveřím.'});
        }
      }
    }
    // high-water mark, not the live streak - a badge earned by hitting a
    // streak once should stay earned even if the streak later breaks
    hen.bestStreak = Math.max(hen.bestStreak||0, computeStreak(hen));
    return toasts;
  }

  // same shape as tickHen above, generalized by species/product - see
  // ANIMAL_PRODUCTS for the conversion rate used in the Friday delivery sum
  function tickAnimal(animal, today){
    var toasts = [];
    var info = (ANIMAL_PRODUCTS[animal.species]||{})[animal.product] || {unitLabel:'jednotek', kcPerUnit:20};
    var label = animal.name || speciesLabel(animal.species);
    if(isWeekday(today)){
      var key = dateKey(today);
      if(animal.paused){
        animal.pausedDates[key] = true;
      } else if(!animal.productLog[key]){
        var msg = ANIMAL_CARE_MESSAGES[Math.floor(Math.random()*ANIMAL_CARE_MESSAGES.length)];
        animal.productLog[key] = {amount:animal.dailyAmount, msg:label+' '+msg, bonus:false, date:key};
        toasts.push({tag:'−'+animal.dailyAmount+' Kč', body:animal.productLog[key].msg});

        if(Math.random() < 0.18){
          var bmsg = label+' má dobrý den — o trochu víc '+info.unitLabel+' navíc do páteční dodávky.';
          animal.productLog[key+'-bonus'] = {amount:0, msg:bmsg, bonus:true, date:key};
          toasts.push({tag:'BONUS', body:bmsg});
        }

        if(today.getDay()===5){
          var mon = mondayOf(today);
          var weekAmount = 0;
          for(var i=0;i<5;i++){
            var dd = new Date(mon.getTime()+i*86400000);
            var k = dateKey(dd);
            if(animal.productLog[k] && !animal.productLog[k].bonus) weekAmount += animal.productLog[k].amount;
          }
          var units = Math.round((weekAmount/info.kcPerUnit)*10)/10;
          animal.deliveries.push({weekStart:dateKey(mon), units:units, amount:weekAmount, status:'transit', date:key});
          toasts.push({tag:'PÁTEK', body:'Tenhle týden jsi '+label+' krmil. Dnes odpoledne dorazí '+units+' '+info.unitLabel+'.'});
        }
      }
    }
    if(animal.deliveries.length){
      var last = animal.deliveries[animal.deliveries.length-1];
      if(last.status==='transit'){
        var fridayDate = dateOnly(new Date(last.date+'T00:00:00'));
        var daysSince = Math.round((dateOnly(today)-fridayDate)/86400000);
        if(daysSince >= 1){
          last.status='delivered';
          toasts.push({tag:'DORUČENO', body:last.units+' '+info.unitLabel+' právě dorazilo ke dveřím.'});
        }
      }
    }
    return toasts;
  }

  function runTick(){
    var today = getNow();
    var activeToasts = [];
    state.hens.forEach(function(hen){
      var toasts = tickHen(hen, today);
      if(state.activePetKind==='hen' && hen.id === state.activeHenId) activeToasts = activeToasts.concat(toasts);
    });
    // same "only the pet currently shown on Domů gets notified" rule as
    // hens above - whichever kind is active is the one that toasts
    (state.animals||[]).forEach(function(animal){
      var toasts = tickAnimal(animal, today);
      if(state.activePetKind==='animal' && animal.id === state.activeAnimalId) activeToasts = activeToasts.concat(toasts);
    });
    saveState();
    if(activeToasts.length) showToasts(activeToasts);
  }

  function computeStreak(hen){
    var d = dateOnly(getNow());
    var todayKey = dateKey(getNow());
    var streak = 0;
    for(var i=0;i<370;i++){
      if(isWeekday(d)){
        var key = dateKey(d);
        if(hen.feedLog[key] && !hen.feedLog[key].bonus){ streak++; }
        else if(hen.pausedDates && hen.pausedDates[key]){ /* frozen by pause, does not break */ }
        else if(key===todayKey){ /* today not ticked yet, skip */ }
        else { break; }
      }
      d = new Date(d.getTime()-86400000);
    }
    return streak;
  }

  function computeWeekBalance(hen){
    var mon = mondayOf(getNow());
    var today = dateOnly(getNow());
    var sum = 0;
    for(var i=0;i<5;i++){
      var dd = new Date(mon.getTime()+i*86400000);
      if(dd.getTime() > today.getTime()) break;
      var k = dateKey(dd);
      if(hen.feedLog[k] && !hen.feedLog[k].bonus) sum += hen.feedLog[k].amount;
    }
    return sum;
  }

  // same shape as computeStreak/computeWeekBalance above, reading
  // animal.productLog instead of hen.feedLog - used by the Statek home view
  function computeAnimalStreak(animal){
    var d = dateOnly(getNow());
    var todayKey = dateKey(getNow());
    var streak = 0;
    for(var i=0;i<370;i++){
      if(isWeekday(d)){
        var key = dateKey(d);
        if(animal.productLog[key] && !animal.productLog[key].bonus){ streak++; }
        else if(animal.pausedDates && animal.pausedDates[key]){ /* frozen by pause */ }
        else if(key===todayKey){ /* today not ticked yet */ }
        else { break; }
      }
      d = new Date(d.getTime()-86400000);
    }
    return streak;
  }
  function computeAnimalWeekBalance(animal){
    var mon = mondayOf(getNow());
    var today = dateOnly(getNow());
    var sum = 0;
    for(var i=0;i<5;i++){
      var dd = new Date(mon.getTime()+i*86400000);
      if(dd.getTime() > today.getTime()) break;
      var k = dateKey(dd);
      if(animal.productLog[k] && !animal.productLog[k].bonus) sum += animal.productLog[k].amount;
    }
    return sum;
  }

  function henStats(hen){
    var totalFeeds = 0, totalBonus = 0;
    Object.keys(hen.feedLog).forEach(function(k){
      if(hen.feedLog[k].bonus) totalBonus++; else totalFeeds++;
    });
    return {
      totalFeeds: totalFeeds,
      totalBonus: totalBonus,
      totalDeliveries: hen.deliveries.length,
      bestStreak: Math.max(hen.bestStreak||0, computeStreak(hen))
    };
  }

  function historyChartSvg(hen){
    var weeks = hen.deliveries.slice(-8);
    if(!weeks.length) return '';
    var maxEggs = Math.max.apply(null, weeks.map(function(w){ return w.eggs; }));
    var barW=34, gap=14, padL=10, padT=20, chartH=84, padB=32;
    var w = weeks.length*(barW+gap)-gap+padL*2;
    var totalH = chartH+padT+padB;
    var bars = weeks.map(function(wk,i){
      var h = maxEggs>0 ? Math.max(6, Math.round(wk.eggs/maxEggs*chartH)) : 6;
      var x = padL + i*(barW+gap);
      var y = padT + (chartH-h);
      var parts = wk.weekStart.split('-');
      return '<rect x="'+x+'" y="'+y+'" width="'+barW+'" height="'+h+'" rx="2" class="hist-bar"/>'+
        '<text x="'+(x+barW/2)+'" y="'+(y-7)+'" class="hist-val mono" text-anchor="middle">'+wk.eggs+'</text>'+
        '<text x="'+(x+barW/2)+'" y="'+(padT+chartH+16)+'" class="hist-lbl mono" text-anchor="middle">'+parts[2]+'.'+parts[1]+'.</text>';
    }).join('');
    return '<svg viewBox="0 0 '+w+' '+totalH+'" style="width:100%;height:auto;display:block;" role="img" aria-label="Počet vajec za posledních týdnů">'+bars+'</svg>';
  }

  // ============ toasts ============
  var toastQueue = [];
  var toastBusy = false;
  function showToasts(list){
    toastQueue = toastQueue.concat(list);
    pumpToasts();
  }
  function pumpToasts(){
    if(toastBusy || !toastQueue.length) return;
    toastBusy = true;
    var t = toastQueue.shift();
    var host = document.getElementById('toast-host');
    var el = document.createElement('div');
    el.className = 'toast';
    el.innerHTML = '<span class="t-tag mono">'+escapeHtml(t.tag)+'</span><span class="t-body">'+escapeHtml(t.body)+'</span>';
    host.appendChild(el);
    requestAnimationFrame(function(){ requestAnimationFrame(function(){ el.classList.add('in'); }); });
    setTimeout(function(){
      el.classList.remove('in');
      setTimeout(function(){
        if(el.parentNode) el.parentNode.removeChild(el);
        toastBusy = false;
        pumpToasts();
      }, 320);
    }, 3400);

    if(('Notification' in window)){
      try{
        if(Notification.permission==='granted'){
          new Notification('Mazlík · '+t.tag, {body:t.body});
        }
      }catch(e){}
    }
  }

  // achievement medal - procedural "stamped coin": reeded edge, double ring,

  // slightly different hand-stamped angle.
  var MEDAL_ROT = [-6, 5, -3, 8, -7, 3, 6, -4];
  function medalSvg(on, idx){
    var rot = MEDAL_ROT[idx % MEDAL_ROT.length];
    var r=15.5, cx=20, cy=20, ticks=16, marks=[];
    for(var i=0;i<ticks;i++){
      var a = (i/ticks)*Math.PI*2;
      var x1=(cx+Math.cos(a)*(r+1)).toFixed(1), y1=(cy+Math.sin(a)*(r+1)).toFixed(1);
      var x2=(cx+Math.cos(a)*(r+3.4)).toFixed(1), y2=(cy+Math.sin(a)*(r+3.4)).toFixed(1);
      marks.push('<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'"/>');
    }
    var ring = on ? 'var(--accent)' : 'var(--line)';
    var fill = on ? 'var(--surface-2)' : 'var(--surface)';
    var center = on
      ? '<path d="M13.5,20 L18,24.5 L27,14.5" fill="none" stroke="var(--accent)" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>'
      : '<circle cx="20" cy="20" r="2.4" fill="var(--line)"/>';
    return '<svg viewBox="0 0 40 40" width="40" height="40" style="overflow:visible;transform:rotate('+rot+'deg)">'+
      '<g stroke="'+ring+'" stroke-width="1.2" opacity="'+(on?'0.9':'0.5')+'">'+marks.join('')+'</g>'+
      '<circle cx="20" cy="20" r="'+r+'" fill="'+fill+'" stroke="'+ring+'" stroke-width="1.6"/>'+
      '<circle cx="20" cy="20" r="'+(r-3.2)+'" fill="none" stroke="'+ring+'" stroke-width="0.8" opacity="0.7"/>'+
      center+

  // ============ render: home ============
  function renderHome(){
    if(state.activePetKind==='animal' && activeAnimal()){ renderAnimalHome(); return; }
    var hen = activeHen();
    var today = getNow();
    var mon = mondayOf(today);
    var todayKey = dateKey(today);
    var days = [];
    for(var i=0;i<5;i++){
      var dd = new Date(mon.getTime()+i*86400000);
      var key = dateKey(dd);
      var isToday = key===todayKey;
      var fed = !!(hen.feedLog[key] && !hen.feedLog[key].bonus);
      days.push({key:key, label:DAY_LABELS[dd.getDay()], fed:fed, today:isToday});
    }
    if(!selDay || days.every(function(d){return d.key!==selDay;})){
      selDay = todayKey;
    }
    var selDayObj = days.filter(function(d){return d.key===selDay;})[0] || days[0];
    var selEntry = hen.feedLog[selDayObj.key];
    var msg, amountLbl;
    if(selEntry){ msg = selEntry.msg; amountLbl = '−'+selEntry.amount+' Kč'; }
    else if(selDayObj.key === todayKey && hen.paused){ msg = 'Dnes je appka pozastavená — '+hen.henName+' se dnes nekrmila.'; amountLbl='—'; }
    else if(selDayObj.key < todayKey){ msg = 'Tenhle den se '+hen.henName+' nenakrmila — appka buď ještě neběžela, nebo byla pozastavená.'; amountLbl='—'; }
    else { msg = 'Tenhle den ještě nenastal.'; amountLbl='—'; }

    var dayChips = days.map(function(d){
      return '<div class="day-chip pressable" data-action="select-home-day" data-day="'+d.key+'" data-fed="'+d.fed+'" data-today="'+d.today+'" data-selected="'+(d.key===selDayObj.key)+'">'+
        '<span class="mono">'+d.label+'</span><span class="dot"></span></div>';
    }).join('');

    var balance = computeWeekBalance(hen);
    var streak = computeStreak(hen);

    var deliveryHtml = '';
    if(hen.deliveries.length){
      var last = hen.deliveries[hen.deliveries.length-1];
      var reachedDelivered = last.status==='delivered';
      deliveryHtml =
        '<div class="card">'+
          '<div class="app-eyebrow">Pátek '+fmtDateHuman(last.date)+'</div>'+
          '<div style="display:flex;align-items:center;justify-content:space-between;">'+
            '<div class="egg-summary-num" style="margin-top:6px;"><span class="n">'+last.eggs+'</span><span class="u">vajec</span></div>'+
            (reachedDelivered ? '<div class="mini-stamp">'+stampSvg('DORUČENO','Mazlík',56)+'</div>' : '')+
          '</div>'+
          '<div class="app-sub">z tvého příspěvku '+last.amount+' Kč za ten týden</div>'+
          '<div class="stepper">'+
            step('ready','PŘIPRAVENO',true)+
            step('transit','NA CESTĚ',true)+
            step('delivered','DORUČENO',reachedDelivered)+
          '</div>'+
        '</div>';
    }

    var host = document.getElementById('main-content');
    host.innerHTML =
      homeSwitcherHtml()+
      '<div class="topbar"><div><div class="app-eyebrow">'+greeting()+'</div><div class="app-h1" style="font-size:23px;margin-top:2px;">Ahoj</div></div>'+
        '<div class="avatar">'+ICO.egg+'</div></div>'+
      '<div class="card hen-card">'+henSvg(hen.paused, henAccessories(hen))+'<div class="hen-name">'+escapeHtml(hen.henName)+(hen.paused?'<span class="status-chip">POZASTAVENO</span>':'')+'</div>'+
        '<div class="hen-meta">'+escapeHtml(farmName(hen.farm))+'</div></div>'+
      '<div><div class="field-label">Tento týden</div><div class="day-row">'+dayChips+'</div></div>'+
      '<div class="reveal-panel"><div class="reveal-top"><span>'+selDayObj.label+' '+fmtDateHuman(selDayObj.key)+'</span><span>'+amountLbl+'</span></div>'+
        '<div class="reveal-msg">'+escapeHtml(msg)+'</div></div>'+
      '<div class="stat-row">'+
        '<div class="stat-tile"><div class="label">Zůstatek k pátku</div><div class="value">'+balance+' Kč</div></div>'+
        '<div class="stat-tile"><div class="label">Série</div><div class="value">'+streak+' dní</div></div>'+
      '</div>'+
      deliveryHtml+
      '<div class="field-label" style="margin-top:20px;">Statek</div>'+
      statekBodyHtml();
  }

  function step(key,label,reached){
    return '<div class="step" data-reached="'+reached+'"><div class="step-track">'+
      '<div class="step-line'+(key==='ready'?' first':'')+'"></div><div class="step-dot"></div>'+
      '<div class="step-line'+(key==='delivered'?' first':'')+'"></div></div>'+
      '<span class="step-label">'+label+'</span></div>';
  }
  function greeting(){
    var h = getNow().getHours();
    if(h<11) return 'Dobré ráno';
    if(h<18) return 'Dobré odpoledne';
    return 'Dobrý večer';
  }

  // ============ render: activity ============
  function renderActivity(){
    var hen = activeHen();
    var entries = [];
    Object.keys(hen.feedLog).forEach(function(k){
      var e = hen.feedLog[k];
      entries.push({when:e.date, type: e.bonus?'bonus':'feed', msg:e.msg, tag: e.bonus?'BONUS':('−'+e.amount+' Kč'), sortKey:k});
    });
    hen.deliveries.forEach(function(d){
      entries.push({when:d.date, type:'summary', msg:'Ten týden jsi '+hen.henName+' krmil za '+d.amount+' Kč. '+(d.status==='delivered'?'Vejce ('+d.eggs+') už dorazila.':'Dnes odpoledne dorazí '+d.eggs+' vajec.'), tag: d.status==='delivered'?'DORUČENO':'SOUHRN', sortKey:d.date+'-z'});
    });
    entries.sort(function(a,b){ return a.sortKey < b.sortKey ? 1 : -1; });
    entries = entries.slice(0,20);

    var visible = entries.filter(function(e){
      if(actFilter==='all') return true;
      if(actFilter==='feed') return e.type==='feed';
      return e.type==='bonus' || e.type==='summary';
    });

    var list = visible.length ? visible.map(function(e){
      return '<div class="stub" data-type="'+e.type+'"><span class="when mono">'+fmtDateHuman(e.when)+'</span>'+
        '<span class="msg">'+escapeHtml(e.msg)+'</span><span class="tag">'+escapeHtml(e.tag)+'</span></div>';
    }).join('') : '<div class="empty-note">Zatím žádná aktivita v tomhle filtru.</div>';

    var filters = [['all','Vše'],['feed','Krmení'],['bonus','Souhrny']].map(function(f){
      return '<div class="pill pressable" data-action="filter" data-filter="'+f[0]+'" data-active="'+(actFilter===f[0])+'">'+f[1]+'</div>';
    }).join('');

    var chartSvg = historyChartSvg(hen);
    var chartHtml = chartSvg ? '<div class="card"><div class="field-label">Vejce po týdnech</div>'+chartSvg+'</div>' : '';

    var host = document.getElementById('main-content');
    host.innerHTML =
      henSwitcherHtml()+
      '<div><div class="app-eyebrow">Historie · '+escapeHtml(hen.henName)+'</div><div class="app-h1" style="margin-top:2px;">Aktivita</div></div>'+
      chartHtml+
      badgesHtml(hen)+
      '<div class="pill-row">'+filters+'</div>'+
      '<div class="stub-list">'+list+'</div>';
  }

  // ============ render: settings ============
  // ============ render: Statek (other livestock) - see docs/LIVESTOCK.md ============
  function renderAddAnimalForm(){
    var productPills = [];
    Object.keys(ANIMAL_PRODUCTS).forEach(function(species){
      Object.keys(ANIMAL_PRODUCTS[species]).forEach(function(product){
        var info = ANIMAL_PRODUCTS[species][product];
        var active = addAnimalDraft.species===species && addAnimalDraft.product===product;
        productPills.push('<div class="pill pressable" data-action="pick-animal-product" data-species="'+species+'" data-product="'+product+'" data-active="'+active+'">'+speciesLabel(species)+' · '+info.unitLabel+'</div>');
      });
    });

    var body = '<div class="card"><div class="field-label">Druh a produkt</div><div class="pill-row">'+productPills.join('')+'</div>';

    if(addAnimalDraft.species){
      var offeringFarms = FARMS.filter(function(f){
        return (f.animalOfferings||[]).some(function(o){ return o.species===addAnimalDraft.species && o.product===addAnimalDraft.product; });
      });
      var farmCards = offeringFarms.length ? offeringFarms.map(function(f){
        var offering = f.animalOfferings.filter(function(o){ return o.species===addAnimalDraft.species && o.product===addAnimalDraft.product; })[0];
        var taken = state.animals.filter(function(a){ return a.farm===f.key && a.species===addAnimalDraft.species && a.product===addAnimalDraft.product; }).length;
        var spotsLeft = offering.capacity - taken;
        var full = spotsLeft <= 0;
        var sel = addAnimalDraft.farmKey===f.key;
        return '<div class="farm-card pressable" data-action="'+(full?'noop':'pick-animal-farm')+'" data-farm="'+f.key+'" data-selected="'+sel+'" style="'+(full?'opacity:.5;':'')+'">'+
          '<div><div class="farm-name">'+escapeHtml(f.name)+'</div><div class="farm-meta">'+(full?'plno':spotsLeft+' volných míst')+'</div></div>'+
          '<div class="check-circle">'+ICO.check+'</div></div>';
      }).join('') : '<div class="empty-note">Žádná farma tohle zatím nenabízí.</div>';

      body +=
        '<div class="field-label" style="margin-top:14px;">Farma</div>'+
        '<div style="display:flex;flex-direction:column;gap:8px;">'+farmCards+'</div>'+
        '<div class="field-label" style="margin-top:14px;">Jméno (nepovinné)</div>'+
        '<input class="text-input" id="add-animal-name" value="'+escapeHtml(addAnimalDraft.name)+'">'+
        '<div class="stepper-row" style="margin-top:12px;">'+
          '<div class="round-btn pressable" data-action="add-animal-amount-minus">'+ICO.minus+'</div>'+
          '<div class="stepper-num">'+addAnimalDraft.dailyAmount+' Kč</div>'+
          '<div class="round-btn pressable" data-action="add-animal-amount-plus">'+ICO.plus+'</div>'+
        '</div>'+
        '<div class="pressable" data-action="adopt-animal-submit" style="margin-top:12px;"><div class="btn-primary" style="font-size:13.5px;padding:12px;">Adoptovat</div></div>';
    }
    body += '<div class="pressable" data-action="add-animal-close" style="margin-top:8px;"><div class="btn-secondary">Zrušit</div></div></div>';
    return body;
  }

  function renderMeatShareCard(s){
    var statusLabel = {open:'OTEVŘENO', full:'NAPLNĚNO', ready:'PŘIPRAVENO'}[s.status] || s.status;
    var draft = shareDraft(s.id);
    var body = '<div class="card">'+
      '<div style="display:flex;align-items:center;justify-content:space-between;gap:8px;">'+
        '<div><div class="farm-name">'+escapeHtml(s.label)+'</div><div class="farm-meta">'+speciesLabel(s.species)+(s.includesHide?' + kůže':'')+'</div></div>'+
        '<span class="status-chip">'+statusLabel+'</span>'+
      '</div>'+
      '<div class="center-mono" style="margin-top:8px;">'+s.myShares+' / '+s.totalShares+' podílů koupeno · '+s.priceCzk+' Kč/podíl</div>';
    if(s.myShares > 0){
      var payout = s.totalYieldKg!=null ? Math.round(s.totalYieldKg*s.myShares/s.totalShares*10)/10 : null;
      body += '<div class="hint mono" style="margin-top:6px;color:var(--accent-text);">Zaplaceno: '+(s.myShares*s.priceCzk)+' Kč'+(payout!=null?' → '+payout+' kg':'')+'</div>';
    }
    if(s.status==='open'){
      body += '<div class="stepper-row" style="margin-top:10px;">'+
        '<div class="round-btn pressable" data-action="share-shares-minus" data-id="'+s.id+'">'+ICO.minus+'</div>'+
        '<div class="stepper-num">'+draft+'</div>'+
        '<div class="round-btn pressable" data-action="share-shares-plus" data-id="'+s.id+'">'+ICO.plus+'</div>'+
      '</div>'+
      '<div class="pressable" data-action="share-contribute" data-id="'+s.id+'" style="margin-top:10px;"><div class="btn-primary" style="font-size:13.5px;padding:11px;">Koupit '+draft+'× podíl</div></div>';
    } else if(s.status==='full' && s.myShares>0){
      body += '<div class="pressable" data-action="share-mark-ready" data-id="'+s.id+'" style="margin-top:10px;"><div class="btn-secondary" style="border:1.5px dashed var(--line);border-radius:4px;">Simulovat zpracování →</div></div>';
    }
    body += '</div>';
    return body;
  }

  // Shared between the Statek tab (renderLivestock, full page) and Home
  // (renderHome/renderAnimalHome, appended below the active pet's own
  // card) - "your animals" list + adopt button + meat shares, so Home
  // shows everything the Statek tab does without leaving the screen.
  function statekBodyHtml(){
    var myAnimalsHtml = state.animals.length ? state.animals.map(function(a){
      var info = (ANIMAL_PRODUCTS[a.species]||{})[a.product] || {unitLabel:a.product};
      var farm = FARMS.filter(function(f){ return f.key===a.farm; })[0];
      var lastDelivery = a.deliveries.length ? a.deliveries[a.deliveries.length-1] : null;
      var deliveryLine = lastDelivery ? (
        '<div class="hint mono" style="margin-top:6px;color:var(--accent-text);">'+
        (lastDelivery.status==='delivered' ? 'Poslední dodávka: '+lastDelivery.units+' '+info.unitLabel+' (doručeno)' : lastDelivery.units+' '+info.unitLabel+' je na cestě')+
        '</div>'
      ) : '';
      return '<div class="card">'+
        '<div style="display:flex;align-items:center;justify-content:space-between;gap:8px;">'+
          '<div><div class="farm-name">'+escapeHtml(a.name || speciesLabel(a.species))+'</div>'+
          '<div class="farm-meta">'+speciesLabel(a.species)+' · '+info.unitLabel+(farm?' · '+escapeHtml(farm.name):'')+'</div></div>'+
          (a.paused?'<span class="status-chip">POZASTAVENO</span>':'')+
        '</div>'+
        deliveryLine+
        '<div class="stepper-row" style="margin-top:10px;">'+
          '<div class="round-btn pressable" data-action="animal-amount-minus" data-id="'+a.id+'">'+ICO.minus+'</div>'+
          '<div class="stepper-num">'+a.dailyAmount+' Kč</div>'+
          '<div class="round-btn pressable" data-action="animal-amount-plus" data-id="'+a.id+'">'+ICO.plus+'</div>'+
        '</div>'+
        '<div style="display:flex;gap:8px;margin-top:12px;">'+
          '<div class="pressable" data-action="animal-toggle-pause" data-id="'+a.id+'" style="flex:1;"><div class="btn-secondary" style="border:1.5px dashed var(--line);border-radius:4px;">'+(a.paused?'Obnovit':'Pozastavit')+'</div></div>'+
          '<div class="pressable" data-action="animal-cancel" data-id="'+a.id+'" style="flex:1;"><div class="btn-secondary" style="border:1.5px dashed var(--accent);border-radius:4px;color:var(--accent-text);">Zrušit</div></div>'+
        '</div>'+
      '</div>';
    }).join('') : '<div class="empty-note">Zatím žádné další zvíře.</div>';

    var addBlock = addAnimalOpen ? renderAddAnimalForm()
      : '<div class="pressable" data-action="add-animal-open"><div class="btn-secondary" style="border:1.5px dashed var(--line);border-radius:4px;">+ Adoptovat další zvíře</div></div>';

    return (
      '<div class="field-label" style="margin-top:6px;">Tvoje zvířata</div>'+
      myAnimalsHtml+
      addBlock+
      '<div class="field-label" style="margin-top:10px;">Sdílený chov na maso</div>'+
      state.meatShares.map(renderMeatShareCard).join('')
    );
  }

  function renderLivestock(){
    var host = document.getElementById('main-content');
    host.innerHTML =
      '<div><div class="app-eyebrow">Statek</div><div class="app-h1" style="margin-top:2px;">Kozy, ovce, krávy</div></div>'+
      '<div class="app-sub">Mléko průběžně, maso jako sdílený chov. Simulované demo, stejně jako farmy vlevo v adopci.</div>'+
      statekBodyHtml();
  }

  function renderSettings(){
    var hen = activeHen();
    var weekly = hen.dailyAmount*5;
    var eggs = eggsPreview(hen.dailyAmount);
    var notifSupported = ('Notification' in window);
    var notifPerm = notifSupported ? Notification.permission : 'unsupported';
    var notifLabel = notifPerm==='granted' ? 'Oznámení povolena' : (notifPerm==='denied' ? 'Oznámení zablokována v prohlížeči' : 'Povolit oznámení');

    var others = state.hens.filter(function(h){ return h.id !== hen.id; });
    var othersHtml = others.length ? (
      '<div class="field-label" style="margin-top:16px;">Ostatní slepičky</div>'+
      others.map(function(h){
        return '<div class="hen-row pressable" data-action="switch-hen" data-hen-id="'+h.id+'">'+
          '<div><div class="farm-name" style="font-size:14px;">'+escapeHtml(h.henName)+(h.paused?'<span class="status-chip">POZASTAVENO</span>':'')+'</div><div class="farm-meta">'+escapeHtml(farmName(h.farm))+'</div></div>'+
          '<span class="mono" style="font-size:10.5px;color:var(--accent-text);">přepnout</span></div>';
      }).join('')
    ) : '';

    var host = document.getElementById('main-content');
    host.innerHTML =
      '<div class="app-h1">Nastavení</div>'+
      '<div class="card"><div class="field-label">Tvoje slepička</div>'+
        '<div style="display:flex;align-items:center;gap:10px;margin-top:6px;">'+
          '<input class="rename-input" id="set-hen-name" type="text" value="'+escapeHtml(hen.henName)+'" style="flex:1;">'+
          '<div style="opacity:.7;flex-shrink:0;">'+ICO.egg+'</div>'+
        '</div>'+
        '<div class="farm-meta" style="margin-top:4px;">'+escapeHtml(farmName(hen.farm))+'</div>'+
        othersHtml+
        '<div class="pressable" data-action="add-hen" style="margin-top:14px;"><div class="btn-secondary" style="border:1.5px dashed var(--line);border-radius:4px;">+ Přidat další slepičku</div></div>'+
      '</div>'+
      '<div class="card"><div class="field-label">Denní příspěvek</div>'+
        '<div class="stepper-row"><div class="round-btn pressable" data-action="amount-minus">'+ICO.minus+'</div>'+
          '<div class="stepper-num">'+hen.dailyAmount+' Kč</div>'+
          '<div class="round-btn pressable" data-action="amount-plus">'+ICO.plus+'</div></div>'+
        '<div class="center-mono" style="margin-top:9px;">týdně '+weekly+' Kč · přibližně '+eggs+' vajec</div>'+
        (nextAccessoryHint(hen) ? '<div class="hint mono" style="margin-top:8px;text-align:center;color:var(--accent-text);">'+escapeHtml(nextAccessoryHint(hen))+'</div>' : '')+
      '</div>'+
      '<div class="card"><div style="display:flex;align-items:center;justify-content:space-between;">'+
          '<div><div class="field-label">Pauza</div><div style="font-size:12.5px;margin-top:6px;">'+(hen.paused?'Pozastaveno — dokud znovu nezapneš.':'Aktivní.')+'</div></div>'+
          '<div class="switch-track pressable" data-action="toggle-pause" data-on="'+(!hen.paused)+'"><div class="switch-knob"></div></div></div>'+
        (hen.paused? '<div class="hint mono" style="margin-top:9px;color:var(--accent-text);">Série se nezruší, jen se zmrazí do dalšího zapnutí.</div>' : '')+
      '</div>'+
      '<div class="card"><div class="field-label">Doručení</div>'+
        '<div style="display:flex;align-items:center;justify-content:space-between;margin-top:8px;"><div style="font-size:13.5px;">'+escapeHtml(hen.address)+'</div></div>'+
        '<div style="display:flex;align-items:center;justify-content:space-between;margin-top:8px;"><div style="font-size:13.5px;">Den svozu</div><span class="mono" style="font-size:11px;color:var(--ink-soft);">Pátek</span></div></div>'+
      '<div class="card"><div class="field-label">Oznámení</div>'+
        '<div class="pressable" data-action="request-notif" style="margin-top:6px;"><div class="btn-primary" style="background:'+(notifPerm==='granted'?'var(--sage)':'var(--accent)')+';font-size:13.5px;padding:12px;">'+escapeHtml(notifLabel)+'</div></div>'+
        '<div class="hint mono" style="margin-top:8px;">V appce vždycky uvidíš oznámení jako lištu nahoře. Skutečná oznámení telefonu závisí na tvém prohlížeči.</div></div>'+
      giftCardHtml()+
      '<div class="demo-box">'+
        '<div class="app-eyebrow">Demo nástroje</div>'+
        '<div class="center-mono" style="margin-top:8px;">simulované dnes: '+fmtFull(getNow())+'</div>'+
        '<div class="pressable" data-action="advance-day" style="margin-top:10px;"><div class="btn-primary" style="background:var(--ink-soft);font-size:13px;padding:11px;">Posunout o den →</div></div>'+
        '<div class="pressable" data-action="reset-app"><div class="btn-secondary">Resetovat appku a začít znovu</div></div>'+
      '</div>';
  }

  // ============ tab bar ============
  function renderTabbar(){
    var tabs = [['home','Domů',ICO.home],['activity','Aktivita',ICO.list],['livestock','Statek',ICO.paw],['settings','Nastavení',ICO.sliders]];
    document.getElementById('tabbar').innerHTML = tabs.map(function(t){
      var active = state.activeTab===t[0];
      return '<div class="tab pressable" data-action="tab" data-tab="'+t[0]+'" data-active="'+active+'">'+
        '<div class="tab-mark"></div>'+t[2]+'<span class="tab-label">'+t[1]+'</span></div>';
    }).join('');
  }

  // ============ dispatcher ============
  function renderAll(){
    if(!state.onboarded || showingOnboarding || !activeHen()){
      document.getElementById('view-onboarding').style.display = 'flex';
      document.getElementById('view-main').style.display = 'none';
      renderOnboarding();
      return;
    }
    document.getElementById('view-onboarding').style.display = 'none';
    document.getElementById('view-main').style.display = 'flex';
    if(state.activeTab==='home') renderHome();
    else if(state.activeTab==='activity') renderActivity();
    else if(state.activeTab==='livestock') renderLivestock();
    else renderSettings();
    renderTabbar();
  }

  function startOnboarding(mode){
    obMode = mode;
    var basedOnAddress = activeHen() ? activeHen().address : '';
    obDraft = {henName:'Nuška', farm:'lipa', dailyAmount:20, address: basedOnAddress || ''};
    obStep = 1;
    showingOnboarding = true;
    renderAll();
  }

  // ============ events (delegated) ============
  document.addEventListener('click', function(e){
    var el = e.target.closest('[data-action]');
    if(!el) return;
    var action = el.getAttribute('data-action');

    if(action==='splash-continue'){
      document.getElementById('view-splash').style.display = 'none';
      if(state.onboarded && activeHen()){ runTick(); }
      renderAll();
    }
    else if(action==='select-farm'){ obDraft.farm = el.getAttribute('data-farm'); renderOnboarding(); }

    // --- Statek (other livestock) - also embedded on Home now, see
    // renderHome()/renderAnimalHome(), so every handler below re-renders
    // via renderAll() (whichever tab/pet is actually active) rather than
    // hardcoding renderLivestock() - a hardcoded call would redraw the
    // Statek tab even if the click actually came from the Home screen's
    // copy of this same UI. ---
    else if(action==='add-animal-open'){ addAnimalOpen = true; addAnimalDraft = {species:'', product:'', farmKey:'', dailyAmount:20, name:''}; renderAll(); }
    else if(action==='add-animal-close'){ addAnimalOpen = false; renderAll(); }
    else if(action==='pick-animal-product'){
      addAnimalDraft.species = el.getAttribute('data-species');
      addAnimalDraft.product = el.getAttribute('data-product');
      addAnimalDraft.farmKey = '';
      renderAll();
    }
    else if(action==='pick-animal-farm'){ addAnimalDraft.farmKey = el.getAttribute('data-farm'); renderAll(); }
    else if(action==='add-animal-amount-minus'){ addAnimalDraft.dailyAmount = Math.max(10, addAnimalDraft.dailyAmount-5); renderAll(); }
    else if(action==='add-animal-amount-plus'){ addAnimalDraft.dailyAmount = Math.min(40, addAnimalDraft.dailyAmount+5); renderAll(); }
    else if(action==='adopt-animal-submit'){
      var animalNameEl = document.getElementById('add-animal-name');
      if(animalNameEl) addAnimalDraft.name = animalNameEl.value.trim();
      if(!addAnimalDraft.species || !addAnimalDraft.farmKey){ showToasts([{tag:'CHYBA', body:'Vyber druh i farmu.'}]); return; }
      var newAnimal = freshAnimal(state.nextAnimalId++, addAnimalDraft.species, addAnimalDraft.product, addAnimalDraft.name, addAnimalDraft.farmKey, addAnimalDraft.dailyAmount, '');
      state.animals.push(newAnimal);
      addAnimalOpen = false;
      saveState();
      tickAnimal(newAnimal, getNow());  // day one, same idea as adopt_hen's immediate tick
      saveState();
      renderAll();
    }
    else if(action==='animal-amount-minus' || action==='animal-amount-plus'){
      var aid = Number(el.getAttribute('data-id'));
      var animalRow = state.animals.filter(function(x){ return x.id===aid; })[0];
      if(!animalRow) return;
      animalRow.dailyAmount = action==='animal-amount-minus' ? Math.max(10, animalRow.dailyAmount-5) : Math.min(40, animalRow.dailyAmount+5);
      saveState(); renderAll();
    }
    else if(action==='animal-toggle-pause'){
      var aid2 = Number(el.getAttribute('data-id'));
      var animalRow2 = state.animals.filter(function(x){ return x.id===aid2; })[0];
      if(!animalRow2) return;
      animalRow2.paused = !animalRow2.paused;
      saveState(); renderAll();
    }
    else if(action==='animal-cancel'){
      var aid3 = Number(el.getAttribute('data-id'));
      if(!window.confirm('Zrušit tohle zvíře? Nejde to vzít zpět.')) return;
      state.animals = state.animals.filter(function(x){ return x.id!==aid3; });
      // Home was showing exactly this animal - fall back to the hen so it
      // never tries to render a pet that no longer exists
      if(state.activePetKind==='animal' && state.activeAnimalId===aid3){ state.activePetKind='hen'; }
      saveState(); renderAll();
    }
    else if(action==='share-shares-minus'){
      var shMinusId = el.getAttribute('data-id');
      var shMinus = state.meatShares.filter(function(x){ return x.id===shMinusId; })[0];
      if(!shMinus) return;
      shareSharesDraft[shMinusId] = Math.max(1, shareDraft(shMinusId)-1);
      renderAll();
    }
    else if(action==='share-shares-plus'){
      var shPlusId = el.getAttribute('data-id');
      var shPlus = state.meatShares.filter(function(x){ return x.id===shPlusId; })[0];
      if(!shPlus) return;
      shareSharesDraft[shPlusId] = Math.min(shPlus.totalShares, shareDraft(shPlusId)+1);
      renderAll();
    }
    else if(action==='share-contribute'){
      var sId = el.getAttribute('data-id');
      var s = state.meatShares.filter(function(x){ return x.id===sId; })[0];
      if(!s) return;
      var left = s.totalShares - s.myShares;
      var n = Math.min(shareDraft(sId), left);
      if(n <= 0) return;
      s.myShares += n;
      if(s.myShares >= s.totalShares) s.status = 'full';
      shareSharesDraft[sId] = 1;
      saveState();
      showToasts([{tag:'PODÍL', body:'Koupeno '+n+'× podíl na „'+s.label+'“ za '+(n*s.priceCzk)+' Kč.'}]);
      renderAll();
    }
    else if(action==='share-mark-ready'){
      var s2Id = el.getAttribute('data-id');
      var s2 = state.meatShares.filter(function(x){ return x.id===s2Id; })[0];
      if(!s2) return;
      // a realistic-ish demo yield per species (dressed-carcass ballpark,
      // cow much bigger than goat/sheep) - same "illustrative number, not a
      // real farmer's report" honesty as everything else here
      var yieldRange = {cow:[180,220], goat:[14,22], sheep:[16,24]}[s2.species] || [50,80];
      s2.totalYieldKg = yieldRange[0] + Math.round(Math.random()*(yieldRange[1]-yieldRange[0]));
      s2.status = 'ready';
      var myPayout = Math.round(s2.totalYieldKg*s2.myShares/s2.totalShares*10)/10;
      saveState();
      showToasts([{tag:'MASO PŘIPRAVENO', body:'„'+s2.label+'“ je hotová — tvůj podíl je '+myPayout+' kg'+(s2.includesHide?' + kůže':'')+'.'}]);
      renderAll();
    }
    else if(action==='geo-request'){ requestLocation(); }
    else if(action==='farm-radius'){
      var r = el.getAttribute('data-radius');
      farmRadius = r==='all' ? 'all' : Number(r);
      renderOnboarding();
    }
    else if(action==='onb-next'){
      var nameEl = document.getElementById('ob-name');
      obDraft.henName = (nameEl && nameEl.value.trim()) || obDraft.henName || 'Nuška';
      obStep = 2; renderOnboarding();
    }
    else if(action==='onb-back'){ obStep = 1; renderOnboarding(); }
    else if(action==='onb-cancel'){ showingOnboarding = false; obMode = 'first'; renderAll(); }
    else if(action==='day-pill'){
      var hint = document.getElementById('ob-hint');
      if(hint && el.getAttribute('data-active')!=='true'){ hint.textContent = 'Zatím jde vybrat jen pátek — víc dní zvažujeme do budoucna.'; }
    }
    else if(action==='onb-finish'){
      var addrEl = document.getElementById('ob-address');
      if(addrEl) obDraft.address = addrEl.value.trim();
      var id = state.nextHenId++;
      var hen = freshHen(id, obDraft.henName, obDraft.farm, obDraft.dailyAmount, obDraft.address);
      state.hens.push(hen);
      state.activeHenId = id;
      state.onboarded = true;
      state.activeTab = 'home';
      showingOnboarding = false;
      selDay = null;
      saveState();
      runTick();
      renderAll();
    }
    else if(action==='tab'){ state.activeTab = el.getAttribute('data-tab'); saveState(); renderAll(); }
    else if(action==='select-home-day'){ selDay = el.getAttribute('data-day'); renderHome(); }
    else if(action==='filter'){ actFilter = el.getAttribute('data-filter'); renderActivity(); }
    else if(action==='switch-hen'){
      state.activeHenId = Number(el.getAttribute('data-hen-id'));
      selDay = null;
      saveState();
      renderAll();
    }
    else if(action==='switch-pet'){
      var petKind = el.getAttribute('data-kind');
      var petId = Number(el.getAttribute('data-id'));
      state.activePetKind = petKind;
      if(petKind==='hen'){ state.activeHenId = petId; } else { state.activeAnimalId = petId; }
      selDay = null;
      saveState();
      renderAll();
    }
    else if(action==='add-hen'){ startOnboarding('add'); }
    else if(action==='amount-minus'){ var h1=activeHen(); h1.dailyAmount = Math.max(10, h1.dailyAmount-5); saveState(); renderSettings(); }
    else if(action==='amount-plus'){
      var h2=activeHen();
      h2.dailyAmount = Math.min(40, h2.dailyAmount+5);
      var before = h2.bestDailyAmount || h2.dailyAmount;
      h2.bestDailyAmount = Math.max(before, h2.dailyAmount);
      var justUnlocked = ACCESSORY_TIERS.filter(function(t){ return before < t.min && h2.bestDailyAmount >= t.min; });
      saveState(); renderSettings();
      if(justUnlocked.length) showToasts(justUnlocked.map(function(t){ return {tag:'NOVINKA', body: t.unlock(h2.henName)}; }));
    }
    else if(action==='toggle-pause'){ var h3=activeHen(); h3.paused = !h3.paused; saveState(); renderSettings(); }
    else if(action==='advance-day'){ state.dayOffset += 1; selDay=null; saveState(); runTick(); renderAll(); }
    else if(action==='reset-app'){
      if(window.confirm('Smazat appku (všechny slepičky) a vrátit se k adopci? Tohle nejde vzít zpět.')){
        state = JSON.parse(JSON.stringify(defaults));
        obStep = 1; obMode='first'; obDraft={henName:'Nuška', farm:'lipa', dailyAmount:20, address:''};
        showingOnboarding=false; selDay=null; actFilter=null;
        saveState(); renderAll();
      }
    }
    else if(action==='request-notif'){
      if('Notification' in window){
        try{
          Notification.requestPermission().then(function(){ renderSettings(); });
        }catch(e){ renderSettings(); }
      } else { renderSettings(); }
    }

    // --- gift voucher ---
    else if(action==='gift-open'){
      giftOpen = true; giftGenerated = false;
      giftDraft = {recipient:'', gifter:'', amount:20, message:''};
      renderSettings();
    }
    else if(action==='gift-close'){ giftOpen = false; giftGenerated = false; renderSettings(); }
    else if(action==='gift-minus'){ syncGiftInputsFromDom(); giftDraft.amount = Math.max(10, giftDraft.amount-5); renderSettings(); }
    else if(action==='gift-plus'){ syncGiftInputsFromDom(); giftDraft.amount = Math.min(40, giftDraft.amount+5); renderSettings(); }
    else if(action==='gift-generate'){
      syncGiftInputsFromDom();
      giftDraft.recipient = giftDraft.recipient.trim();
      giftDraft.gifter = giftDraft.gifter.trim();
      giftDraft.message = giftDraft.message.trim();
      giftGenerated = true;
      renderSettings();
    }
    else if(action==='gift-copy'){
      var certText = giftCertificateText();
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(certText).then(function(){
          showToasts([{tag:'ZKOPÍROVÁNO', body:'Poukaz je ve schránce, teď ho někam vlož.'}]);
        }).catch(function(){
          showToasts([{tag:'CHYBA', body:'Kopírování nevyšlo — text si označ a zkopíruj ručně.'}]);
        });
      } else {
        showToasts([{tag:'INFO', body:'Kopírování prohlížeč nepodporuje — text si označ a zkopíruj ručně.'}]);
      }
    }
  });

  document.addEventListener('input', function(e){
    if(e.target.id==='ob-range'){
      var amt = Number(e.target.value);
      document.getElementById('ob-amount-num').textContent = amt;
      document.getElementById('ob-weekly').textContent = amt*5;
      document.getElementById('ob-eggs').textContent = eggsPreview(amt);
      obDraft.dailyAmount = amt;
    }
    else if(e.target.id==='ob-address'){ obDraft.address = e.target.value; }
  });

  // rename fires on blur/Enter, not per-keystroke, so the input never loses
  // focus to a mid-typing re-render
  document.addEventListener('change', function(e){
    if(e.target.id==='set-hen-name'){
      var hen = activeHen();
      var val = e.target.value.trim();
      if(hen && val){ hen.henName = val; saveState(); renderAll(); }
      else if(hen){ e.target.value = hen.henName; }
    }
  });

  // ============ boot ============
  // Splash shows first (its own CSS defaults to visible) - the daily tick
  // and the real onboarding/home decision both wait for the tap, same as
  // the real backend-connected webapp's splash screen.
  document.getElementById('view-onboarding').style.display = 'none';
  document.getElementById('view-main').style.display = 'none';
  renderSplash();
})();
</script>
