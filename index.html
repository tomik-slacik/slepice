<title>Kvoč</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kvoč">
<meta name="theme-color" content="#E8DCC3">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rye&family=Bitter:wght@600;700;800&family=Karla:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#E8DCC3; --surface:#F6F0E3; --surface-2:#EFE4CB;
    --ink:#241B14; --ink-soft:#5B4A38; --line:#CDBB93;
    --accent:#C4471F; --accent-text:#9A371A; --yolk:#DDA13B;
    --shadow:#CDBB93; --feather:#A66A3B; --sage:#748253;
  }
  *,*::before,*::after{box-sizing:border-box;}
  html,body{margin:0;padding:0;min-height:100vh;min-height:100dvh;}
  body{
    background:var(--bg);color:var(--ink);
    font-family:'Karla',-apple-system,'Segoe UI',sans-serif;line-height:1.5;
    -webkit-tap-highlight-color:transparent;
    overscroll-behavior-y:contain;
  }
  img,svg{display:block;max-width:100%;}
  .mono{font-family:'IBM Plex Mono','SFMono-Regular',Consolas,monospace;}
  input,button{font:inherit;}

  #shell{
    max-width:480px;margin:0 auto;min-height:100vh;min-height:100dvh;
    display:flex;flex-direction:column;background:var(--bg);position:relative;
  }

  /* ---------- onboarding ---------- */
  #view-onboarding{flex:1;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top,0px) + 26px) 22px 24px;gap:18px;}
  .topbar{display:flex;align-items:center;justify-content:space-between;}
  .icon-btn{color:var(--ink);cursor:pointer;padding:4px;}
  .app-eyebrow{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent-text);}
  .app-h1{font-family:'Bitter',serif;font-weight:800;font-size:25px;text-wrap:balance;}
  .app-sub{font-size:13.5px;color:var(--ink-soft);line-height:1.5;}

  .card{background:var(--surface);border:1px solid var(--line);border-radius:4px;box-shadow:2px 2px 0 var(--shadow);padding:16px;}
  .pressable{cursor:pointer;transition:transform .08s ease;user-select:none;}
  .pressable:active{transform:translate(1px,1px);}

  .btn-primary{
    background:var(--accent);color:var(--surface);border-radius:4px;box-shadow:2px 2px 0 var(--shadow);
    padding:16px;text-align:center;font-family:'Bitter',serif;font-weight:700;font-size:15.5px;
    display:flex;align-items:center;justify-content:center;gap:8px;border:none;width:100%;
  }
  .btn-secondary{
    background:transparent;color:var(--ink-soft);text-align:center;font-family:'IBM Plex Mono',monospace;
    font-size:12px;padding:10px;
  }

  .field-label{font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:8px;}
  .name-input{font-family:'Bitter',serif;font-weight:700;font-size:19px;color:var(--ink);background:transparent;border:none;border-bottom:2px solid var(--line);padding:8px 2px;width:100%;outline:none;}
  .name-input:focus{border-bottom-color:var(--accent);}
  .text-input{font-family:'Karla',sans-serif;font-size:14px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:11px 12px;width:100%;outline:none;}
  .text-input:focus{border-color:var(--accent);}
  .rename-input{font-family:'Bitter',serif;font-weight:700;font-size:16.5px;color:var(--ink);background:transparent;border:none;border-bottom:2px solid var(--line);padding:4px 2px;outline:none;}
  .rename-input:focus{border-bottom-color:var(--accent);}

  .farm-card{display:flex;align-items:center;justify-content:space-between;gap:10px;border:1.5px solid var(--line);border-radius:4px;box-shadow:2px 2px 0 var(--shadow);padding:13px 15px;background:var(--surface);}
  .farm-card[data-selected="true"]{border-color:var(--accent);background:var(--surface-2);}
  .farm-name{font-family:'Bitter',serif;font-weight:700;font-size:15px;}
  .farm-meta{font-size:12px;color:var(--ink-soft);margin-top:2px;}
  .check-circle{width:21px;height:21px;border-radius:50%;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:transparent;}
  .farm-card[data-selected="true"] .check-circle{background:var(--accent);border-color:var(--accent);color:var(--surface);}

  .amount-card{background:var(--surface);border:1px solid var(--line);border-radius:4px;box-shadow:3px 3px 0 var(--shadow);padding:18px 18px 14px;}
  .amount-display{display:flex;align-items:baseline;justify-content:center;gap:6px;}
  .amount-num{font-family:'Bitter',serif;font-weight:800;font-size:46px;color:var(--accent-text);font-variant-numeric:tabular-nums;line-height:1;}
  .amount-unit{font-family:'Bitter',serif;font-weight:700;font-size:16px;color:var(--ink-soft);}
  input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:6px;background:var(--line);border-radius:3px;outline:none;margin:14px 0 4px;}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;border-radius:50%;background:var(--accent);border:3px solid var(--surface);box-shadow:2px 2px 0 var(--shadow);cursor:pointer;}
  input[type=range]::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:var(--accent);border:3px solid var(--surface);box-shadow:2px 2px 0 var(--shadow);cursor:pointer;}
  input[type=range]::-moz-range-track{width:100%;height:6px;background:var(--line);border-radius:3px;}
  .range-ends{display:flex;justify-content:space-between;font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--ink-soft);}

  .reveal-panel{background:var(--surface);border-left:3px solid var(--accent);padding:13px 15px;box-shadow:2px 2px 0 var(--shadow);}
  .reveal-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:5px;gap:8px;}
  .reveal-top span{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--ink-soft);}
  .reveal-msg{font-size:13.5px;line-height:1.5;}

  .day-pill-row{display:flex;gap:5px;}
  .day-pill{flex:1;text-align:center;padding:8px 0;border-radius:4px;background:var(--surface);color:var(--ink-soft);border:1.5px solid var(--line);font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:600;}
  .day-pill[data-active="true"]{background:var(--accent);color:var(--surface);border-color:var(--accent);}
  .hint{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--ink-soft);margin-top:7px;min-height:14px;}

  .step-dots{display:flex;gap:5px;justify-content:center;}
  .step-dots span{width:6px;height:6px;border-radius:50%;background:var(--line);}
  .step-dots span[data-on="true"]{background:var(--accent);}

  /* ---------- main shell ---------- */
  #view-main{flex:1;display:none;flex-direction:column;min-height:100vh;min-height:100dvh;}
  #main-content{flex:1;overflow-y:auto;padding:calc(env(safe-area-inset-top,0px) + 26px) 20px calc(86px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px;}

  .avatar{width:38px;height:38px;border-radius:50%;background:var(--surface);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;flex-shrink:0;}

  .hen-card{display:flex;flex-direction:column;align-items:center;gap:2px;}
  .hen-name{font-family:'Bitter',serif;font-weight:700;font-size:19px;margin-top:4px;}
  .hen-meta{font-size:13px;color:var(--ink-soft);}

  .hen-switcher{display:flex;gap:8px;overflow-x:auto;padding-bottom:1px;}
  .hen-chip{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:5px;padding:8px 12px;border-radius:4px;border:1.5px solid var(--line);background:var(--surface);}
  .hen-chip[data-active="true"]{border-color:var(--accent);background:var(--surface-2);}
  .hc-avatar{width:24px;height:24px;border-radius:50%;background:var(--surface-2);display:flex;align-items:center;justify-content:center;}
  .hen-chip[data-active="true"] .hc-avatar{background:var(--accent);}
  .hc-name{font-size:10px;font-weight:600;max-width:64px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink-soft);}
  .hen-chip[data-active="true"] .hc-name{color:var(--ink);}

  .hen-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-top:1px solid var(--line);}

  .day-row{display:flex;gap:7px;}
  .day-chip{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;padding:10px 0;border:1.5px solid var(--line);border-radius:4px;background:var(--surface);color:var(--ink-soft);}
  .day-chip .dot{width:5px;height:5px;border-radius:50%;background:transparent;}
  .day-chip[data-today="true"] .dot{background:var(--accent);}
  .day-chip[data-fed="true"]{color:var(--ink);}
  .day-chip[data-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface);}
  .day-chip[data-today="true"][data-selected="true"] .dot{background:var(--surface);}

  .stat-row{display:flex;gap:10px;}
  .stat-tile{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:13px 14px;box-shadow:2px 2px 0 var(--shadow);}
  .stat-tile .label{font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);}
  .stat-tile .value{font-family:'Bitter',serif;font-weight:700;font-size:20px;margin-top:4px;font-variant-numeric:tabular-nums;}

  .egg-summary-num{display:flex;align-items:baseline;gap:8px;}
  .egg-summary-num .n{font-family:'Bitter',serif;font-weight:800;font-size:34px;color:var(--accent-text);}
  .egg-summary-num .u{font-family:'Bitter',serif;font-weight:700;font-size:15px;color:var(--ink-soft);}

  .stepper{display:flex;align-items:flex-start;margin-top:14px;}
  .step{flex:1;display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;}
  .step-track{width:100%;display:flex;align-items:center;}
  .step-line{flex:1;height:2px;background:var(--line);}
  .step-line.first{background:transparent !important;}
  .step-dot{width:14px;height:14px;border-radius:50%;background:var(--surface);border:2px solid var(--line);flex-shrink:0;}
  .step[data-reached="true"] .step-dot{background:var(--accent);border-color:var(--accent);}
  .step[data-reached="true"] .step-line{background:var(--accent);}
  .step-label{font-family:'IBM Plex Mono',monospace;font-size:9px;font-weight:600;color:var(--ink-soft);}
  .step[data-reached="true"] .step-label{color:var(--ink);}

  .pill-row{display:flex;gap:6px;flex-wrap:wrap;}
  .pill{padding:8px 13px;border-radius:20px;background:var(--surface);color:var(--ink-soft);border:1.5px solid var(--line);font-family:'IBM Plex Mono',monospace;font-size:10.5px;font-weight:600;}
  .pill[data-active="true"]{background:var(--accent);color:var(--surface);border-color:var(--accent);}

  .stub-list{display:flex;flex-direction:column;gap:8px;}
  .stub{display:flex;align-items:baseline;gap:12px;background:var(--surface);padding:11px 13px;box-shadow:2px 2px 0 var(--shadow);border-left:3px solid var(--line);}
  .stub[data-type="bonus"]{border-left-color:var(--yolk);}
  .stub[data-type="summary"]{border-left-color:var(--accent);}
  .stub .when{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--ink-soft);flex:0 0 64px;}
  .stub .msg{flex:1;font-size:12.5px;line-height:1.4;}
  .stub .tag{font-family:'IBM Plex Mono',monospace;font-size:9.5px;color:var(--ink-soft);flex:0 0 auto;font-weight:600;}
  .stub[data-type="bonus"] .tag{background:var(--yolk);color:#241B14;padding:2px 6px;}
  .stub[data-type="summary"] .tag{color:var(--accent-text);}
  .empty-note{font-size:13px;color:var(--ink-soft);text-align:center;padding:24px 12px;}

  .badge-row{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 4px;}
  .badge-chip{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:5px;width:72px;opacity:.4;}
  .badge-chip[data-on="true"]{opacity:1;}
  .badge-medal{width:40px;height:40px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;background:var(--surface);}
  .badge-chip[data-on="true"] .badge-medal{border-color:var(--accent);background:var(--surface-2);}
  .badge-label{font-size:9px;text-align:center;line-height:1.3;color:var(--ink-soft);}
  .badge-chip[data-on="true"] .badge-label{color:var(--ink);font-weight:600;}

  .hist-bar{fill:var(--accent);}
  .hist-val{font-size:11px;fill:var(--accent-text);font-weight:600;}
  .hist-lbl{font-size:9px;fill:var(--ink-soft);}

  .gift-cert{background:var(--surface-2);border:1.5px dashed var(--line);padding:14px;font-size:11.5px;line-height:1.6;margin-top:8px;}

  .round-btn{width:38px;height:38px;border-radius:50%;background:var(--surface-2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .stepper-row{display:flex;align-items:center;justify-content:center;gap:18px;margin-top:10px;}
  .stepper-num{font-family:'Bitter',serif;font-weight:800;font-size:26px;color:var(--accent-text);font-variant-numeric:tabular-nums;min-width:82px;text-align:center;}
  .center-mono{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink-soft);text-align:center;}

  .switch-track{width:44px;height:25px;border-radius:13px;background:var(--accent);position:relative;flex-shrink:0;transition:background .15s ease;}
  .switch-track[data-on="false"]{background:var(--ink-soft);}
  .switch-knob{width:19px;height:19px;border-radius:50%;background:var(--surface);position:absolute;top:3px;left:22px;box-shadow:1px 1px 0 var(--shadow);transition:left .15s ease;}
  .switch-track[data-on="false"] .switch-knob{left:3px;}

  .demo-box{border:1.5px dashed var(--line);border-radius:4px;padding:14px 16px;}
  .demo-box .app-eyebrow{color:var(--sage);}

  /* ---------- tab bar ---------- */
  #tabbar{
    position:fixed;left:0;right:0;bottom:0;
    max-width:480px;margin:0 auto;
    height:calc(70px + env(safe-area-inset-bottom,0px));
    padding-bottom:env(safe-area-inset-bottom,0px);
    background:var(--surface);border-top:1px solid var(--line);display:flex;z-index:5;
  }
  .tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--ink-soft);cursor:pointer;}
  .tab[data-active="true"]{color:var(--accent-text);}
  .tab-mark{width:20px;height:2px;background:transparent;border-radius:2px;}
  .tab[data-active="true"] .tab-mark{background:var(--accent-text);}
  .tab-label{font-family:'IBM Plex Mono',monospace;font-size:9.5px;}

  /* ---------- toasts ---------- */
  #toast-host{
    position:fixed;top:0;left:0;right:0;display:flex;flex-direction:column;align-items:center;
    padding-top:calc(env(safe-area-inset-top,0px) + 10px);z-index:20;pointer-events:none;
  }
  .toast{
    width:calc(100% - 32px);max-width:440px;background:var(--surface);border:1px solid var(--line);
    border-left:3px solid var(--accent);box-shadow:2px 3px 0 var(--shadow);padding:11px 14px;margin-bottom:8px;
    display:flex;align-items:baseline;gap:10px;
    transform:translateY(-140%);opacity:0;transition:transform .32s cubic-bezier(.2,.8,.3,1.1),opacity .32s ease;
  }
  .toast.in{transform:translateY(0);opacity:1;}
  .toast .t-tag{font-family:'IBM Plex Mono',monospace;font-size:9px;color:var(--accent-text);letter-spacing:.06em;flex:0 0 auto;}
  .toast .t-body{font-size:12.5px;flex:1;}

  @media (prefers-reduced-motion: reduce){
    .pressable, .switch-knob, .switch-track, .toast{transition:none;}
  }
</style>

<div id="shell">
  <div id="toast-host"></div>
  <div id="view-onboarding"></div>
  <div id="view-main">
    <div id="main-content"></div>
    <div id="tabbar"></div>
  </div>
</div>

<script>
(function(){
  'use strict';

  // ============ constants ============
  var STORAGE_KEY = 'kvoc_app_state_v2';
  var FARMS = [
    {key:'lipa', name:'Farma U Lípy', meta:'volný výběh · Sázava, 18 km'},
    {key:'dvur', name:'Dvůr Na Kopci', meta:'bio chov · Benešov, 24 km'},
    {key:'polana', name:'Polana Farm', meta:'volný výběh · Neveklov, 9 km'}
  ];
  var FEED_MESSAGES = [
    'dostala ranní zrníčko.',
    'se napila studánkové vody.',
    'se vyhřívala na sluníčku a hrabala se v hlíně.',
    'si pochutnala na tučném červíkovi.',
    'si protáhla křídla na dvorku.',
    'si hověla v čerstvé podestýlce.',
    'se proháněla po dvorku za motýlem.'
  ];
  var DAY_LABELS = ['NE','PO','ÚT','ST','ČT','PÁ','SO'];

  // ============ state — a list of independent hens ============
  function freshHen(id, henName, farm, dailyAmount, address){
    return {
      id: id, henName: henName, farm: farm, dailyAmount: dailyAmount, address: address,
      paused: false, feedLog: {}, deliveries: [], pausedDates: {}, bestStreak: 0
    };
  }

  var defaults = {
    onboarded: false, dayOffset: 0, activeTab: 'home', activeHenId: null,
    nextHenId: 1, hens: []
  };
  var state = loadState();
  if(!state || !Array.isArray(state.hens)){ state = JSON.parse(JSON.stringify(defaults)); }

  var obStep = 1;
  var obMode = 'first';       // 'first' (very first hen) | 'add' (adding another)
  // Initialized with real defaults up front (not null) - renderOnboarding()
  // reads obDraft.* unconditionally, and the very first render for a brand
  // new visitor happens before startOnboarding() is ever called.
  var obDraft = {henName:'Nuška', farm:'lipa', dailyAmount:20, address:''};
  var showingOnboarding = false; // transient - lets "add a hen" reopen onboarding without touching state.onboarded
  var selDay = null;
  var actFilter = 'all';

  // gift voucher - transient, not tied to any one hen, never persisted
  var giftOpen = false;
  var giftGenerated = false;
  var giftDraft = {recipient:'', gifter:'', amount:20, message:''};

  function loadState(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      if(raw){ var parsed = JSON.parse(raw); return Object.assign({}, defaults, parsed); }
    }catch(e){}
    return null;
  }
  function saveState(){ try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){} }

  function activeHen(){
    return state.hens.filter(function(h){ return h.id === state.activeHenId; })[0] || state.hens[0] || null;
  }

  // ============ date helpers ============
  function pad(n){ return n<10 ? '0'+n : ''+n; }
  function dateKey(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
  function getNow(){ return new Date(Date.now() + state.dayOffset*86400000); }
  function dateOnly(d){ return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
  function isWeekday(d){ var g=d.getDay(); return g>=1 && g<=5; }
  function mondayOf(d){
    var g=d.getDay(); var diff=(g===0)?-6:(1-g);
    var m=dateOnly(d); m.setDate(m.getDate()+diff); return m;
  }
  function fmtDateHuman(key){
    var parts=key.split('-'); return parts[2]+'.'+parts[1]+'.';
  }
  function fmtFull(d){
    var days=['neděle','pondělí','úterý','středa','čtvrtek','pátek','sobota'];
    return days[d.getDay()]+' '+d.getDate()+'.'+(d.getMonth()+1)+'.';
  }
  function eggsPreview(amount){ return Math.max(1, Math.round(amount*5/12.5)); }
  function farmName(key){ var f=FARMS.filter(function(x){return x.key===key;})[0]; return f? f.name+' · '+f.meta.split('·')[0].trim() : ''; }

  // ============ business logic (per hen) ============
  function tickHen(hen, today){
    var toasts = [];
    if(isWeekday(today)){
      var key = dateKey(today);
      if(hen.paused){
        hen.pausedDates[key] = true;
      } else if(!hen.feedLog[key]){
        var msg = FEED_MESSAGES[Math.floor(Math.random()*FEED_MESSAGES.length)];
        hen.feedLog[key] = {amount:hen.dailyAmount, msg:hen.henName+' '+msg, bonus:false, date:key};
        toasts.push({tag:'−'+hen.dailyAmount+' Kč', body:hen.feedLog[key].msg});

        if(Math.random() < 0.18){
          var bmsg = hen.henName+' má dobrý den — snesla vejce navíc. Přidáme ho do páteční bedýnky.';
          hen.feedLog[key+'-bonus'] = {amount:0, msg:bmsg, bonus:true, date:key};
          toasts.push({tag:'BONUS', body:bmsg});
        }

        if(today.getDay()===5){
          var mon = mondayOf(today);
          var weekAmount = 0;
          for(var i=0;i<5;i++){
            var dd = new Date(mon.getTime()+i*86400000);
            var k = dateKey(dd);
            if(hen.feedLog[k] && !hen.feedLog[k].bonus) weekAmount += hen.feedLog[k].amount;
          }
          var eggs = Math.max(1, Math.round(weekAmount/12.5));
          hen.deliveries.push({weekStart:dateKey(mon), eggs:eggs, amount:weekAmount, status:'transit', date:key});
          toasts.push({tag:'PÁTEK', body:'Tenhle týden jsi '+hen.henName+' krmil. Dnes odpoledne dorazí '+eggs+' vajec.'});
        }
      }
    }
    if(hen.deliveries.length){
      var last = hen.deliveries[hen.deliveries.length-1];
      if(last.status==='transit'){
        var fridayDate = dateOnly(new Date(last.date+'T00:00:00'));
        var daysSince = Math.round((dateOnly(today)-fridayDate)/86400000);
        if(daysSince >= 1){
          last.status='delivered';
          toasts.push({tag:'DORUČENO', body:last.eggs+' vajec právě dorazilo ke dveřím.'});
        }
      }
    }
    // high-water mark, not the live streak - a badge earned by hitting a
    // streak once should stay earned even if the streak later breaks
    hen.bestStreak = Math.max(hen.bestStreak||0, computeStreak(hen));
    return toasts;
  }

  function runTick(){
    var today = getNow();
    var activeToasts = [];
    state.hens.forEach(function(hen){
      var toasts = tickHen(hen, today);
      if(hen.id === state.activeHenId) activeToasts = activeToasts.concat(toasts);
    });
    saveState();
    if(activeToasts.length) showToasts(activeToasts);
  }

  function computeStreak(hen){
    var d = dateOnly(getNow());
    var todayKey = dateKey(getNow());
    var streak = 0;
    for(var i=0;i<370;i++){
      if(isWeekday(d)){
        var key = dateKey(d);
        if(hen.feedLog[key] && !hen.feedLog[key].bonus){ streak++; }
        else if(hen.pausedDates && hen.pausedDates[key]){ /* frozen by pause, does not break */ }
        else if(key===todayKey){ /* today not ticked yet, skip */ }
        else { break; }
      }
      d = new Date(d.getTime()-86400000);
    }
    return streak;
  }

  function computeWeekBalance(hen){
    var mon = mondayOf(getNow());
    var today = dateOnly(getNow());
    var sum = 0;
    for(var i=0;i<5;i++){
      var dd = new Date(mon.getTime()+i*86400000);
      if(dd.getTime() > today.getTime()) break;
      var k = dateKey(dd);
      if(hen.feedLog[k] && !hen.feedLog[k].bonus) sum += hen.feedLog[k].amount;
    }
    return sum;
  }

  function henStats(hen){
    var totalFeeds = 0, totalBonus = 0;
    Object.keys(hen.feedLog).forEach(function(k){
      if(hen.feedLog[k].bonus) totalBonus++; else totalFeeds++;
    });
    return {
      totalFeeds: totalFeeds,
      totalBonus: totalBonus,
      totalDeliveries: hen.deliveries.length,
      bestStreak: Math.max(hen.bestStreak||0, computeStreak(hen))
    };
  }

  function historyChartSvg(hen){
    var weeks = hen.deliveries.slice(-8);
    if(!weeks.length) return '';
    var maxEggs = Math.max.apply(null, weeks.map(function(w){ return w.eggs; }));
    var barW=34, gap=14, padL=10, padT=20, chartH=84, padB=32;
    var w = weeks.length*(barW+gap)-gap+padL*2;
    var totalH = chartH+padT+padB;
    var bars = weeks.map(function(wk,i){
      var h = maxEggs>0 ? Math.max(6, Math.round(wk.eggs/maxEggs*chartH)) : 6;
      var x = padL + i*(barW+gap);
      var y = padT + (chartH-h);
      var parts = wk.weekStart.split('-');
      return '<rect x="'+x+'" y="'+y+'" width="'+barW+'" height="'+h+'" rx="2" class="hist-bar"/>'+
        '<text x="'+(x+barW/2)+'" y="'+(y-7)+'" class="hist-val mono" text-anchor="middle">'+wk.eggs+'</text>'+
        '<text x="'+(x+barW/2)+'" y="'+(padT+chartH+16)+'" class="hist-lbl mono" text-anchor="middle">'+parts[2]+'.'+parts[1]+'.</text>';
    }).join('');
    return '<svg viewBox="0 0 '+w+' '+totalH+'" style="width:100%;height:auto;display:block;" role="img" aria-label="Počet vajec za posledních týdnů">'+bars+'</svg>';
  }

  function pumpToasts(){
    if(toastBusy || !toastQueue.length) return;
    toastBusy = true;
    var t = toastQueue.shift();
    var host = document.getElementById('toast-host');
    var el = document.createElement('div');
    el.className = 'toast';
    el.innerHTML = '<span class="t-tag mono">'+escapeHtml(t.tag)+'</span><span class="t-body">'+escapeHtml(t.body)+'</span>';
    host.appendChild(el);
    requestAnimationFrame(function(){ requestAnimationFrame(function(){ el.classList.add('in'); }); });
    setTimeout(function(){
      el.classList.remove('in');
      setTimeout(function(){
        if(el.parentNode) el.parentNode.removeChild(el);
        toastBusy = false;
        pumpToasts();
      }, 320);
    }, 3400);

    if(('Notification' in window)){
      try{
        if(Notification.permission==='granted'){
          new Notification('Kvoč · '+t.tag, {body:t.body});
        }
      }catch(e){}
    }
  }

  }
  function step(key,label,reached){
    return '<div class="step" data-reached="'+reached+'"><div class="step-track">'+
      '<div class="step-line'+(key==='ready'?' first':'')+'"></div><div class="step-dot"></div>'+
      '<div class="step-line'+(key==='delivered'?' first':'')+'"></div></div>'+
      '<span class="step-label">'+label+'</span></div>';
  }
  function greeting(){
    var h = getNow().getHours();
    if(h<11) return 'Dobré ráno';
    if(h<18) return 'Dobré odpoledne';
    return 'Dobrý večer';
  }

  // ============ render: activity ============
  function renderActivity(){
    var hen = activeHen();
    var entries = [];
    Object.keys(hen.feedLog).forEach(function(k){
      var e = hen.feedLog[k];
      entries.push({when:e.date, type: e.bonus?'bonus':'feed', msg:e.msg, tag: e.bonus?'BONUS':('−'+e.amount+' Kč'), sortKey:k});
    });
    hen.deliveries.forEach(function(d){
      entries.push({when:d.date, type:'summary', msg:'Ten týden jsi '+hen.henName+' krmil za '+d.amount+' Kč. '+(d.status==='delivered'?'Vejce ('+d.eggs+') už dorazila.':'Dnes odpoledne dorazí '+d.eggs+' vajec.'), tag: d.status==='delivered'?'DORUČENO':'SOUHRN', sortKey:d.date+'-z'});
    });
    entries.sort(function(a,b){ return a.sortKey < b.sortKey ? 1 : -1; });
    entries = entries.slice(0,20);

    var visible = entries.filter(function(e){
      if(actFilter==='all') return true;
      if(actFilter==='feed') return e.type==='feed';
      return e.type==='bonus' || e.type==='summary';
    });

    var list = visible.length ? visible.map(function(e){
      return '<div class="stub" data-type="'+e.type+'"><span class="when mono">'+fmtDateHuman(e.when)+'</span>'+
        '<span class="msg">'+escapeHtml(e.msg)+'</span><span class="tag">'+escapeHtml(e.tag)+'</span></div>';
    }).join('') : '<div class="empty-note">Zatím žádná aktivita v tomhle filtru.</div>';

    var filters = [['all','Vše'],['feed','Krmení'],['bonus','Souhrny']].map(function(f){
      return '<div class="pill pressable" data-action="filter" data-filter="'+f[0]+'" data-active="'+(actFilter===f[0])+'">'+f[1]+'</div>';
    }).join('');

    var chartSvg = historyChartSvg(hen);
    var chartHtml = chartSvg ? '<div class="card"><div class="field-label">Vejce po týdnech</div>'+chartSvg+'</div>' : '';

    var host = document.getElementById('main-content');
    host.innerHTML =
      henSwitcherHtml()+
      '<div><div class="app-eyebrow">Historie · '+escapeHtml(hen.henName)+'</div><div class="app-h1" style="margin-top:2px;">Aktivita</div></div>'+
      chartHtml+
      badgesHtml(hen)+
      '<div class="pill-row">'+filters+'</div>'+
      '<div class="stub-list">'+list+'</div>';
  }

  // ============ render: settings ============
  function renderSettings(){
    var hen = activeHen();
    var weekly = hen.dailyAmount*5;
    var eggs = eggsPreview(hen.dailyAmount);
    var notifSupported = ('Notification' in window);
    var notifPerm = notifSupported ? Notification.permission : 'unsupported';
    var notifLabel = notifPerm==='granted' ? 'Oznámení povolena' : (notifPerm==='denied' ? 'Oznámení zablokována v prohlížeči' : 'Povolit oznámení');

    var others = state.hens.filter(function(h){ return h.id !== hen.id; });
    var othersHtml = others.length ? (
      '<div class="field-label" style="margin-top:16px;">Ostatní slepičky</div>'+
      others.map(function(h){
        return '<div class="hen-row pressable" data-action="switch-hen" data-hen-id="'+h.id+'">'+
          '<div><div class="farm-name" style="font-size:14px;">'+escapeHtml(h.henName)+'</div><div class="farm-meta">'+escapeHtml(farmName(h.farm))+'</div></div>'+
          '<span class="mono" style="font-size:10.5px;color:var(--accent-text);">přepnout</span></div>';
      }).join('')
    ) : '';

    var host = document.getElementById('main-content');
    host.innerHTML =
      '<div class="app-h1">Nastavení</div>'+
      '<div class="card"><div class="field-label">Tvoje slepička</div>'+
        '<div style="display:flex;align-items:center;gap:10px;margin-top:6px;">'+
          '<input class="rename-input" id="set-hen-name" type="text" value="'+escapeHtml(hen.henName)+'" style="flex:1;">'+
          '<div style="opacity:.7;flex-shrink:0;">'+ICO.egg+'</div>'+
        '</div>'+
        '<div class="farm-meta" style="margin-top:4px;">'+escapeHtml(farmName(hen.farm))+'</div>'+
        othersHtml+
        '<div class="pressable" data-action="add-hen" style="margin-top:14px;"><div class="btn-secondary" style="border:1.5px dashed var(--line);border-radius:4px;">+ Přidat další slepičku</div></div>'+
      '</div>'+
      '<div class="card"><div class="field-label">Denní příspěvek</div>'+
        '<div class="stepper-row"><div class="round-btn pressable" data-action="amount-minus">'+ICO.minus+'</div>'+
          '<div class="stepper-num">'+hen.dailyAmount+' Kč</div>'+
          '<div class="round-btn pressable" data-action="amount-plus">'+ICO.plus+'</div></div>'+
        '<div class="center-mono" style="margin-top:9px;">týdně '+weekly+' Kč · přibližně '+eggs+' vajec</div></div>'+
      '<div class="card"><div style="display:flex;align-items:center;justify-content:space-between;">'+
          '<div><div class="field-label">Pauza</div><div style="font-size:12.5px;margin-top:6px;">'+(hen.paused?'Pozastaveno — dokud znovu nezapneš.':'Aktivní.')+'</div></div>'+
          '<div class="switch-track pressable" data-action="toggle-pause" data-on="'+(!hen.paused)+'"><div class="switch-knob"></div></div></div>'+
        (hen.paused? '<div class="hint mono" style="margin-top:9px;color:var(--accent-text);">Série se nezruší, jen se zmrazí do dalšího zapnutí.</div>' : '')+
      '</div>'+
      '<div class="card"><div class="field-label">Doručení</div>'+
        '<div style="display:flex;align-items:center;justify-content:space-between;margin-top:8px;"><div style="font-size:13.5px;">'+escapeHtml(hen.address)+'</div></div>'+
        '<div style="display:flex;align-items:center;justify-content:space-between;margin-top:8px;"><div style="font-size:13.5px;">Den svozu</div><span class="mono" style="font-size:11px;color:var(--ink-soft);">Pátek</span></div></div>'+
      '<div class="card"><div class="field-label">Oznámení</div>'+
        '<div class="pressable" data-action="request-notif" style="margin-top:6px;"><div class="btn-primary" style="background:'+(notifPerm==='granted'?'var(--sage)':'var(--accent)')+';font-size:13.5px;padding:12px;">'+escapeHtml(notifLabel)+'</div></div>'+
        '<div class="hint mono" style="margin-top:8px;">V appce vždycky uvidíš oznámení jako lištu nahoře. Skutečná oznámení telefonu závisí na tvém prohlížeči.</div></div>'+
      giftCardHtml()+
      '<div class="demo-box">'+
        '<div class="app-eyebrow">Demo nástroje</div>'+
        '<div class="center-mono" style="margin-top:8px;">simulované dnes: '+fmtFull(getNow())+'</div>'+
        '<div class="pressable" data-action="advance-day" style="margin-top:10px;"><div class="btn-primary" style="background:var(--ink-soft);font-size:13px;padding:11px;">Posunout o den →</div></div>'+
        '<div class="pressable" data-action="reset-app"><div class="btn-secondary">Resetovat appku a začít znovu</div></div>'+
      '</div>';
  }

  // ============ tab bar ============
  function renderTabbar(){
    var tabs = [['home','Domů',ICO.home],['activity','Aktivita',ICO.list],['settings','Nastavení',ICO.sliders]];
    document.getElementById('tabbar').innerHTML = tabs.map(function(t){
      var active = state.activeTab===t[0];
      return '<div class="tab pressable" data-action="tab" data-tab="'+t[0]+'" data-active="'+active+'">'+
        '<div class="tab-mark"></div>'+t[2]+'<span class="tab-label">'+t[1]+'</span></div>';
    }).join('');
  }

  // ============ dispatcher ============
  function renderAll(){
    if(!state.onboarded || showingOnboarding || !activeHen()){
      document.getElementById('view-onboarding').style.display = 'flex';
      document.getElementById('view-main').style.display = 'none';
      renderOnboarding();
      return;
    }
    document.getElementById('view-onboarding').style.display = 'none';
    document.getElementById('view-main').style.display = 'flex';
    if(state.activeTab==='home') renderHome();
    else if(state.activeTab==='activity') renderActivity();
    else renderSettings();
    renderTabbar();
  }

  function startOnboarding(mode){
    obMode = mode;
    var basedOnAddress = activeHen() ? activeHen().address : '';
    obDraft = {henName:'Nuška', farm:'lipa', dailyAmount:20, address: basedOnAddress || ''};
    obStep = 1;
    showingOnboarding = true;
    renderAll();
  }

  // ============ events (delegated) ============
  document.addEventListener('click', function(e){
    var el = e.target.closest('[data-action]');
    if(!el) return;
    var action = el.getAttribute('data-action');

    if(action==='select-farm'){ obDraft.farm = el.getAttribute('data-farm'); renderOnboarding(); }
    else if(action==='onb-next'){
      var nameEl = document.getElementById('ob-name');
      obDraft.henName = (nameEl && nameEl.value.trim()) || obDraft.henName || 'Nuška';
      obStep = 2; renderOnboarding();
    }
    else if(action==='onb-back'){ obStep = 1; renderOnboarding(); }
    else if(action==='onb-cancel'){ showingOnboarding = false; obMode = 'first'; renderAll(); }
    else if(action==='day-pill'){
      var hint = document.getElementById('ob-hint');
      if(hint && el.getAttribute('data-active')!=='true'){ hint.textContent = 'Zatím jde vybrat jen pátek — víc dní zvažujeme do budoucna.'; }
    }
    else if(action==='onb-finish'){
      var addrEl = document.getElementById('ob-address');
      if(addrEl) obDraft.address = addrEl.value.trim();
      var id = state.nextHenId++;
      var hen = freshHen(id, obDraft.henName, obDraft.farm, obDraft.dailyAmount, obDraft.address);
      state.hens.push(hen);
      state.activeHenId = id;
      state.onboarded = true;
      state.activeTab = 'home';
      showingOnboarding = false;
      selDay = null;
      saveState();
      runTick();
      renderAll();
    }
    else if(action==='tab'){ state.activeTab = el.getAttribute('data-tab'); saveState(); renderAll(); }
    else if(action==='select-home-day'){ selDay = el.getAttribute('data-day'); renderHome(); }
    else if(action==='filter'){ actFilter = el.getAttribute('data-filter'); renderActivity(); }
    else if(action==='switch-hen'){
      state.activeHenId = Number(el.getAttribute('data-hen-id'));
      selDay = null;
      saveState();
      renderAll();
    }
    else if(action==='add-hen'){ startOnboarding('add'); }
    else if(action==='amount-minus'){ var h1=activeHen(); h1.dailyAmount = Math.max(10, h1.dailyAmount-5); saveState(); renderSettings(); }
    else if(action==='amount-plus'){ var h2=activeHen(); h2.dailyAmount = Math.min(40, h2.dailyAmount+5); saveState(); renderSettings(); }
    else if(action==='toggle-pause'){ var h3=activeHen(); h3.paused = !h3.paused; saveState(); renderSettings(); }
    else if(action==='advance-day'){ state.dayOffset += 1; selDay=null; saveState(); runTick(); renderAll(); }
    else if(action==='reset-app'){
      if(window.confirm('Smazat appku (všechny slepičky) a vrátit se k adopci? Tohle nejde vzít zpět.')){
        state = JSON.parse(JSON.stringify(defaults));
        obStep = 1; obMode='first'; obDraft={henName:'Nuška', farm:'lipa', dailyAmount:20, address:''};
        showingOnboarding=false; selDay=null; actFilter=null;
        saveState(); renderAll();
      }
    }
    else if(action==='request-notif'){
      if('Notification' in window){
        try{
          Notification.requestPermission().then(function(){ renderSettings(); });
        }catch(e){ renderSettings(); }
      } else { renderSettings(); }
    }

    // --- gift voucher ---
    else if(action==='gift-open'){
      giftOpen = true; giftGenerated = false;
      giftDraft = {recipient:'', gifter:'', amount:20, message:''};
      renderSettings();
    }
    else if(action==='gift-close'){ giftOpen = false; giftGenerated = false; renderSettings(); }
    else if(action==='gift-minus'){ syncGiftInputsFromDom(); giftDraft.amount = Math.max(10, giftDraft.amount-5); renderSettings(); }
    else if(action==='gift-plus'){ syncGiftInputsFromDom(); giftDraft.amount = Math.min(40, giftDraft.amount+5); renderSettings(); }
    else if(action==='gift-generate'){
      syncGiftInputsFromDom();
      giftDraft.recipient = giftDraft.recipient.trim();
      giftDraft.gifter = giftDraft.gifter.trim();
      giftDraft.message = giftDraft.message.trim();
      giftGenerated = true;
      renderSettings();
    }
    else if(action==='gift-copy'){
      var certText = giftCertificateText();
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(certText).then(function(){
          showToasts([{tag:'ZKOPÍROVÁNO', body:'Poukaz je ve schránce, teď ho někam vlož.'}]);
        }).catch(function(){
          showToasts([{tag:'CHYBA', body:'Kopírování nevyšlo — text si označ a zkopíruj ručně.'}]);
        });
      } else {
        showToasts([{tag:'INFO', body:'Kopírování prohlížeč nepodporuje — text si označ a zkopíruj ručně.'}]);
      }
    }
  });

  document.addEventListener('input', function(e){
    if(e.target.id==='ob-range'){
      var amt = Number(e.target.value);
      document.getElementById('ob-amount-num').textContent = amt;
      document.getElementById('ob-weekly').textContent = amt*5;
      document.getElementById('ob-eggs').textContent = eggsPreview(amt);
      obDraft.dailyAmount = amt;
    }
    else if(e.target.id==='ob-address'){ obDraft.address = e.target.value; }
  });

  // rename fires on blur/Enter, not per-keystroke, so the input never loses
  // focus to a mid-typing re-render
  document.addEventListener('change', function(e){
    if(e.target.id==='set-hen-name'){
      var hen = activeHen();
      var val = e.target.value.trim();
      if(hen && val){ hen.henName = val; saveState(); renderAll(); }
      else if(hen){ e.target.value = hen.henName; }
    }
  });

  // ============ boot ============
  // the very first tick only runs once onboarding actually finishes (onb-finish),
  // so day one reflects the hen name / amount the user just chose, not the defaults
  if(state.onboarded && activeHen()){ runTick(); }
  renderAll();
})();
</script>
