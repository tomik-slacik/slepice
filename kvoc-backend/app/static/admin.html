<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<title>Kvoč · Admin</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Bitter:wght@600;700;800&family=Karla:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#E8DCC3; --surface:#F6F0E3; --surface-2:#EFE4CB;
    --ink:#241B14; --ink-soft:#5B4A38; --line:#CDBB93;
    --accent:#C4471F; --accent-text:#9A371A; --sage:#748253; --err:#B00020;
  }
  *,*::before,*::after{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'Karla',sans-serif;line-height:1.5;padding:24px 18px 60px;}
  .mono{font-family:'IBM Plex Mono',monospace;}
  h1{font-family:'Bitter',serif;font-weight:800;font-size:26px;margin:0 0 4px;}
  .sub{color:var(--ink-soft);font-size:13px;margin-bottom:22px;}
  .wrap{max-width:760px;margin:0 auto;}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:4px;box-shadow:2px 2px 0 var(--line);padding:16px 18px;margin-bottom:18px;}
  .card h2{font-family:'Bitter',serif;font-size:16px;margin:0 0 12px;}
  label{display:block;font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:5px;}
  input,button,select{font:inherit;}
  input[type=text],input[type=password],input[type=number]{width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:4px;padding:9px 10px;font-size:14px;color:var(--ink);margin-bottom:10px;}
  button{background:var(--accent);color:var(--surface);border:none;border-radius:4px;padding:10px 16px;font-family:'Bitter',serif;font-weight:700;font-size:13.5px;cursor:pointer;box-shadow:2px 2px 0 var(--line);}
  button:active{transform:translate(1px,1px);}
  button.secondary{background:transparent;color:var(--ink-soft);box-shadow:none;border:1.5px dashed var(--line);}
  .stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;}
  .stat{background:var(--surface-2);border:1px solid var(--line);border-radius:4px;padding:10px 12px;}
  .stat .n{font-family:'Bitter',serif;font-weight:800;font-size:22px;color:var(--accent-text);}
  .stat .l{font-family:'IBM Plex Mono',monospace;font-size:9.5px;color:var(--ink-soft);text-transform:uppercase;}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);}
  th{font-family:'IBM Plex Mono',monospace;font-size:10px;text-transform:uppercase;color:var(--ink-soft);}
  .err{color:var(--err);font-size:12.5px;min-height:16px;}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;}
  .row>div{flex:1;min-width:110px;}
  .hidden{display:none;}
  .pill{display:inline-block;font-family:'IBM Plex Mono',monospace;font-size:9.5px;padding:2px 7px;border-radius:20px;background:var(--surface-2);border:1px solid var(--line);color:var(--ink-soft);}
  .pill.full{background:var(--err);color:#fff;border-color:var(--err);}
</style>
</head>
<body>
<div class="wrap">
  <h1>Kvoč · Admin</h1>
  <div class="sub">Přehled provozu. Přístup přes admin token nebo přihlášený admin účet.</div>

  <div class="card" id="gate">
    <h2>Přístup</h2>
    <label>Admin token (X-Admin-Token)</label>
    <input type="password" id="tok" placeholder="nastaveno přes KVOC_ADMIN_TOKEN na serveru">
    <button onclick="saveTokenAndLoad()">Přihlásit</button>
    <div class="err" id="gate-err"></div>
  </div>

  <div id="app" class="hidden">
    <div class="card">
      <h2>Přehled</h2>
      <div class="stat-grid" id="stats"></div>
    </div>

    <div class="card">
      <h2>Farmy</h2>
      <table id="farms-table"><thead><tr><th>Farma</th><th>Klíč</th><th>Kapacita</th><th>Volno</th></tr></thead><tbody></tbody></table>
      <h2 style="margin-top:18px;">Přidat farmu</h2>
      <div class="row">
        <div><label>Klíč</label><input type="text" id="f-key" placeholder="napr-farma-x"></div>
        <div><label>Název</label><input type="text" id="f-name" placeholder="Farma X"></div>
        <div><label>Popis</label><input type="text" id="f-desc" placeholder="bio chov"></div>
      </div>
      <div class="row">
        <div><label>Lat</label><input type="text" id="f-lat" placeholder="50.0755"></div>
        <div><label>Lng</label><input type="text" id="f-lng" placeholder="14.4378"></div>
        <div><label>Kapacita/týden</label><input type="number" id="f-cap" placeholder="40"></div>
      </div>
      <button onclick="createFarm()">Přidat farmu</button>
      <div class="err" id="farm-err"></div>
    </div>

    <div class="card">
      <h2>Uživatelé</h2>
      <table id="users-table"><thead><tr><th>E-mail</th><th>Slepičky</th><th>Karta</th><th>Založeno</th></tr></thead><tbody></tbody></table>
    </div>
  </div>
</div>

<script>
(function(){
  'use strict';
  var TOK_KEY = 'kvoc_admin_token';

  function tok(){ try{ return localStorage.getItem(TOK_KEY) || ''; }catch(e){ return ''; } }
  function setTok(t){ try{ localStorage.setItem(TOK_KEY, t); }catch(e){} }

  function api(path, opts){
    opts = opts || {};
    var headers = Object.assign({'X-Admin-Token': tok()}, opts.headers||{});
    if(opts.body !== undefined) headers['Content-Type'] = 'application/json';
    return fetch(path, Object.assign({method:'GET'}, opts, {headers:headers})).then(function(r){
      return r.text().then(function(t){
        var data = {}; try{ data = t?JSON.parse(t):{}; }catch(e){}
        if(!r.ok) throw new Error(data.detail || ('chyba '+r.status));
        return data;
      });
    });
  }

  window.saveTokenAndLoad = function(){
    var v = document.getElementById('tok').value.trim();
    setTok(v);
    load();
  };

  function renderStats(s){
    var items = [
      ['Účty', s.total_users], ['Slepičky', s.total_hens], ['Aktivní', s.active_hens],
      ['Pozastavené', s.paused_hens], ['Tržby (Kč)', s.revenue_total_czk], ['Neúspěšné platby', s.failed_topups]
    ];
    document.getElementById('stats').innerHTML = items.map(function(i){
      return '<div class="stat"><div class="n mono">'+i[1]+'</div><div class="l">'+i[0]+'</div></div>';
    }).join('');
  }

  function renderFarms(farms){
    document.querySelector('#farms-table tbody').innerHTML = farms.map(function(f){
      var full = f.spots_left!=null && f.spots_left<=0;
      var spots = f.spots_left==null ? '—' : '<span class="pill'+(full?' full':'')+'">'+f.spots_left+'</span>';
      return '<tr><td>'+f.name+'</td><td class="mono">'+f.key+'</td><td>'+(f.weekly_capacity==null?'—':f.weekly_capacity)+'</td><td>'+spots+'</td></tr>';
    }).join('');
  }

  function renderUsers(users){
    document.querySelector('#users-table tbody').innerHTML = users.map(function(u){
      return '<tr><td>'+u.email+'</td><td>'+u.hen_count+'</td><td>'+(u.has_saved_payment_method?'ano':'ne')+'</td><td class="mono">'+(u.created_at||'').slice(0,10)+'</td></tr>';
    }).join('');
  }

  window.createFarm = function(){
    var errEl = document.getElementById('farm-err');
    errEl.textContent = '';
    var body = {
      key: document.getElementById('f-key').value.trim(),
      name: document.getElementById('f-name').value.trim(),
      description: document.getElementById('f-desc').value.trim(),
      lat: parseFloat(document.getElementById('f-lat').value) || null,
      lng: parseFloat(document.getElementById('f-lng').value) || null,
      weekly_capacity: parseInt(document.getElementById('f-cap').value, 10) || null
    };
    if(!body.key || !body.name){ errEl.textContent = 'Klíč a název jsou povinné.'; return; }
    api('/admin/farms', {method:'POST', body: JSON.stringify(body)}).then(function(){
      ['f-key','f-name','f-desc','f-lat','f-lng','f-cap'].forEach(function(id){ document.getElementById(id).value=''; });
      load();
    }).catch(function(e){ errEl.textContent = e.message; });
  };

  function load(){
    var gateErr = document.getElementById('gate-err');
    gateErr.textContent = '';
    Promise.all([api('/admin/stats'), api('/admin/farms'), api('/admin/users')]).then(function(r){
      document.getElementById('gate').classList.add('hidden');
      document.getElementById('app').classList.remove('hidden');
      renderStats(r[0]); renderFarms(r[1]); renderUsers(r[2]);
    }).catch(function(e){
      document.getElementById('app').classList.add('hidden');
      document.getElementById('gate').classList.remove('hidden');
      gateErr.textContent = e.message;
    });
  }

  document.getElementById('tok').value = tok();
  load();
})();
</script>
</body>
</html>
