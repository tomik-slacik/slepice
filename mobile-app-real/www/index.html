<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<title>Kvoč</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kvoč">
<meta name="theme-color" content="#E8DCC3">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rye&family=Bitter:wght@600;700;800&family=Karla:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#E8DCC3; --surface:#F6F0E3; --surface-2:#EFE4CB;
    --ink:#241B14; --ink-soft:#5B4A38; --line:#CDBB93;
    --accent:#C4471F; --accent-text:#9A371A; --yolk:#DDA13B;
    --shadow:#CDBB93; --feather:#A66A3B; --sage:#748253; --err:#B00020;
  }
  *,*::before,*::after{box-sizing:border-box;}
  html,body{margin:0;padding:0;min-height:100vh;min-height:100dvh;}
  body{
    background:var(--bg);color:var(--ink);
    font-family:'Karla',-apple-system,'Segoe UI',sans-serif;line-height:1.5;
    -webkit-tap-highlight-color:transparent;
    overscroll-behavior-y:contain;
  }
  img,svg{display:block;max-width:100%;}
  .mono{font-family:'IBM Plex Mono','SFMono-Regular',Consolas,monospace;}
  input,button{font:inherit;}

  #shell{
    max-width:480px;margin:0 auto;min-height:100vh;min-height:100dvh;
    display:flex;flex-direction:column;background:var(--bg);position:relative;
  }

  /* ---------- shared onboarding/auth chrome ---------- */
  #view-auth, #view-onboarding{flex:1;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top,0px) + 26px) 22px 24px;gap:18px;}
  .topbar{display:flex;align-items:center;justify-content:space-between;}
  .icon-btn{color:var(--ink);cursor:pointer;padding:4px;}
  .app-eyebrow{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent-text);}
  .app-h1{font-family:'Bitter',serif;font-weight:800;font-size:25px;text-wrap:balance;}
  .app-sub{font-size:13.5px;color:var(--ink-soft);line-height:1.5;}

  .card{background:var(--surface);border:1px solid var(--line);border-radius:4px;box-shadow:2px 2px 0 var(--shadow);padding:16px;}
  .pressable{cursor:pointer;transition:transform .08s ease;user-select:none;}
  .pressable:active{transform:translate(1px,1px);}

  .btn-primary{
    background:var(--accent);color:var(--surface);border-radius:4px;box-shadow:2px 2px 0 var(--shadow);
    padding:16px;text-align:center;font-family:'Bitter',serif;font-weight:700;font-size:15.5px;
    display:flex;align-items:center;justify-content:center;gap:8px;border:none;width:100%;
  }
  .btn-primary.busy{opacity:.6;}
  .btn-secondary{
    background:transparent;color:var(--ink-soft);text-align:center;font-family:'IBM Plex Mono',monospace;
    font-size:12px;padding:10px;
  }

  .field-label{font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:8px;}
  .name-input{font-family:'Bitter',serif;font-weight:700;font-size:19px;color:var(--ink);background:transparent;border:none;border-bottom:2px solid var(--line);padding:8px 2px;width:100%;outline:none;}
  .name-input:focus{border-bottom-color:var(--accent);}
  .text-input{font-family:'Karla',sans-serif;font-size:14px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:11px 12px;width:100%;outline:none;}
  .text-input:focus{border-color:var(--accent);}
  .error-text{font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--err);min-height:14px;}
  .auth-toggle{text-align:center;font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--accent-text);cursor:pointer;padding:6px;}

  .farm-card{display:flex;align-items:center;justify-content:space-between;gap:10px;border:1.5px solid var(--line);border-radius:4px;box-shadow:2px 2px 0 var(--shadow);padding:13px 15px;background:var(--surface);}
  .farm-card[data-selected="true"]{border-color:var(--accent);background:var(--surface-2);}
  .farm-name{font-family:'Bitter',serif;font-weight:700;font-size:15px;}
  .farm-meta{font-size:12px;color:var(--ink-soft);margin-top:2px;}
  .check-circle{width:21px;height:21px;border-radius:50%;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:transparent;}
  .farm-card[data-selected="true"] .check-circle{background:var(--accent);border-color:var(--accent);color:var(--surface);}

  .amount-card{background:var(--surface);border:1px solid var(--line);border-radius:4px;box-shadow:3px 3px 0 var(--shadow);padding:18px 18px 14px;}
  .amount-display{display:flex;align-items:baseline;justify-content:center;gap:6px;}
  .amount-num{font-family:'Bitter',serif;font-weight:800;font-size:46px;color:var(--accent-text);font-variant-numeric:tabular-nums;line-height:1;}
  .amount-unit{font-family:'Bitter',serif;font-weight:700;font-size:16px;color:var(--ink-soft);}
  input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:6px;background:var(--line);border-radius:3px;outline:none;margin:14px 0 4px;}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;border-radius:50%;background:var(--accent);border:3px solid var(--surface);box-shadow:2px 2px 0 var(--shadow);cursor:pointer;}
  input[type=range]::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:var(--accent);border:3px solid var(--surface);box-shadow:2px 2px 0 var(--shadow);cursor:pointer;}
  input[type=range]::-moz-range-track{width:100%;height:6px;background:var(--line);border-radius:3px;}
  .range-ends{display:flex;justify-content:space-between;font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--ink-soft);}

  .reveal-panel{background:var(--surface);border-left:3px solid var(--accent);padding:13px 15px;box-shadow:2px 2px 0 var(--shadow);}
  .reveal-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:5px;gap:8px;}
  .reveal-top span{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--ink-soft);}
  .reveal-msg{font-size:13.5px;line-height:1.5;}

  .day-pill-row{display:flex;gap:5px;}
  .day-pill{flex:1;text-align:center;padding:8px 0;border-radius:4px;background:var(--surface);color:var(--ink-soft);border:1.5px solid var(--line);font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:600;}
  .day-pill[data-active="true"]{background:var(--accent);color:var(--surface);border-color:var(--accent);}
  .hint{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--ink-soft);margin-top:7px;min-height:14px;}

  .step-dots{display:flex;gap:5px;justify-content:center;}
  .step-dots span{width:6px;height:6px;border-radius:50%;background:var(--line);}
  .step-dots span[data-on="true"]{background:var(--accent);}

  /* ---------- main shell ---------- */
  #view-main{flex:1;display:none;flex-direction:column;min-height:100vh;min-height:100dvh;}
  #main-content{flex:1;overflow-y:auto;padding:calc(env(safe-area-inset-top,0px) + 26px) 20px calc(86px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px;}

  .avatar{width:38px;height:38px;border-radius:50%;background:var(--surface);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;flex-shrink:0;}

  .hen-card{display:flex;flex-direction:column;align-items:center;gap:2px;}
  .hen-name{font-family:'Bitter',serif;font-weight:700;font-size:19px;margin-top:4px;}
  .hen-meta{font-size:13px;color:var(--ink-soft);}

  .day-row{display:flex;gap:7px;}
  .day-chip{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;padding:10px 0;border:1.5px solid var(--line);border-radius:4px;background:var(--surface);color:var(--ink-soft);}
  .day-chip .dot{width:5px;height:5px;border-radius:50%;background:transparent;}
  .day-chip[data-today="true"] .dot{background:var(--accent);}
  .day-chip[data-fed="true"]{color:var(--ink);}
  .day-chip[data-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface);}
  .day-chip[data-today="true"][data-selected="true"] .dot{background:var(--surface);}

  .stat-row{display:flex;gap:10px;}
  .stat-tile{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:13px 14px;box-shadow:2px 2px 0 var(--shadow);}
  .stat-tile .label{font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);}
  .stat-tile .value{font-family:'Bitter',serif;font-weight:700;font-size:20px;margin-top:4px;font-variant-numeric:tabular-nums;}

  .egg-summary-num{display:flex;align-items:baseline;gap:8px;}
  .egg-summary-num .n{font-family:'Bitter',serif;font-weight:800;font-size:34px;color:var(--accent-text);}
  .egg-summary-num .u{font-family:'Bitter',serif;font-weight:700;font-size:15px;color:var(--ink-soft);}

  .stepper{display:flex;align-items:flex-start;margin-top:14px;}
  .step{flex:1;display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;}
  .step-track{width:100%;display:flex;align-items:center;}
  .step-line{flex:1;height:2px;background:var(--line);}
  .step-line.first{background:transparent !important;}
  .step-dot{width:14px;height:14px;border-radius:50%;background:var(--surface);border:2px solid var(--line);flex-shrink:0;}
  .step[data-reached="true"] .step-dot{background:var(--accent);border-color:var(--accent);}
  .step[data-reached="true"] .step-line{background:var(--accent);}
  .step-label{font-family:'IBM Plex Mono',monospace;font-size:9px;font-weight:600;color:var(--ink-soft);}
  .step[data-reached="true"] .step-label{color:var(--ink);}

  .pill-row{display:flex;gap:6px;flex-wrap:wrap;}
  .pill{padding:8px 13px;border-radius:20px;background:var(--surface);color:var(--ink-soft);border:1.5px solid var(--line);font-family:'IBM Plex Mono',monospace;font-size:10.5px;font-weight:600;}
  .pill[data-active="true"]{background:var(--accent);color:var(--surface);border-color:var(--accent);}

  .stub-list{display:flex;flex-direction:column;gap:8px;}
  .stub{display:flex;align-items:baseline;gap:12px;background:var(--surface);padding:11px 13px;box-shadow:2px 2px 0 var(--shadow);border-left:3px solid var(--line);}
  .stub[data-type="bonus"]{border-left-color:var(--yolk);}
  .stub[data-type="summary"]{border-left-color:var(--accent);}
  .stub .when{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--ink-soft);flex:0 0 64px;}
  .stub .msg{flex:1;font-size:12.5px;line-height:1.4;}
  .stub .tag{font-family:'IBM Plex Mono',monospace;font-size:9.5px;color:var(--ink-soft);flex:0 0 auto;font-weight:600;}
  .stub[data-type="bonus"] .tag{background:var(--yolk);color:#241B14;padding:2px 6px;}
  .stub[data-type="summary"] .tag{color:var(--accent-text);}
  .empty-note{font-size:13px;color:var(--ink-soft);text-align:center;padding:24px 12px;}

  .round-btn{width:38px;height:38px;border-radius:50%;background:var(--surface-2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .stepper-row{display:flex;align-items:center;justify-content:center;gap:18px;margin-top:10px;}
  .stepper-num{font-family:'Bitter',serif;font-weight:800;font-size:26px;color:var(--accent-text);font-variant-numeric:tabular-nums;min-width:82px;text-align:center;}
  .center-mono{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink-soft);text-align:center;}

  .switch-track{width:44px;height:25px;border-radius:13px;background:var(--accent);position:relative;flex-shrink:0;transition:background .15s ease;}
  .switch-track[data-on="false"]{background:var(--ink-soft);}
  .switch-knob{width:19px;height:19px;border-radius:50%;background:var(--surface);position:absolute;top:3px;left:22px;box-shadow:1px 1px 0 var(--shadow);transition:left .15s ease;}
  .switch-track[data-on="false"] .switch-knob{left:3px;}

  .demo-box{border:1.5px dashed var(--line);border-radius:4px;padding:14px 16px;}
  .demo-box .app-eyebrow{color:var(--sage);}

  #stripe-payment-element{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:12px;}

  /* ---------- tab bar ---------- */
  #tabbar{
    position:fixed;left:0;right:0;bottom:0;
    max-width:480px;margin:0 auto;
    height:calc(70px + env(safe-area-inset-bottom,0px));
    padding-bottom:env(safe-area-inset-bottom,0px);
    background:var(--surface);border-top:1px solid var(--line);display:flex;z-index:5;
  }
  .tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--ink-soft);cursor:pointer;}
  .tab[data-active="true"]{color:var(--accent-text);}
  .tab-mark{width:20px;height:2px;background:transparent;border-radius:2px;}
  .tab[data-active="true"] .tab-mark{background:var(--accent-text);}
  .tab-label{font-family:'IBM Plex Mono',monospace;font-size:9.5px;}

  /* ---------- toasts ---------- */
  #toast-host{
    position:fixed;top:0;left:0;right:0;display:flex;flex-direction:column;align-items:center;
    padding-top:calc(env(safe-area-inset-top,0px) + 10px);z-index:20;pointer-events:none;
  }
  .toast{
    width:calc(100% - 32px);max-width:440px;background:var(--surface);border:1px solid var(--line);
    border-left:3px solid var(--accent);box-shadow:2px 3px 0 var(--shadow);padding:11px 14px;margin-bottom:8px;
    display:flex;align-items:baseline;gap:10px;
    transform:translateY(-140%);opacity:0;transition:transform .32s cubic-bezier(.2,.8,.3,1.1),opacity .32s ease;
  }
  .toast.in{transform:translateY(0);opacity:1;}
  .toast.err{border-left-color:var(--err);}
  .toast .t-tag{font-family:'IBM Plex Mono',monospace;font-size:9px;color:var(--accent-text);letter-spacing:.06em;flex:0 0 auto;}
  .toast.err .t-tag{color:var(--err);}
  .toast .t-body{font-size:12.5px;flex:1;}

  @media (prefers-reduced-motion: reduce){
    .pressable, .switch-knob, .switch-track, .toast{transition:none;}
  }
</style>
</head>
<body>
<div id="shell">
  <div id="toast-host"></div>
  <div id="view-auth"></div>
  <div id="view-onboarding"></div>
  <div id="view-main">
    <div id="main-content"></div>
    <div id="tabbar"></div>
  </div>
</div>

<!-- Absent (404, harmless) when served normally from this backend's own
     /app/ mount - relative API paths are already correct there. Present
     only in mobile-app-real/www/config.js, the native-wrapped copy of this
     same page - see API_BASE below and docs/DEPLOYMENT.md. -->
<script src="config.js"></script>
<script>
(function(){
  'use strict';

  // ============ constants ============
  var TOKEN_KEY = 'kvoc_token';
  var FEED_MESSAGES_HINT = null; // messages now come from the server - kept only for reference
  var DAY_LABELS = ['NE','PO','ÚT','ST','ČT','PÁ','SO'];

  // ============ session state (server is the source of truth) ============
  var token = null;
  var me = null;              // {id, email, has_saved_payment_method}
  var farms = [];              // [{id,key,name,description}]
  var hen = null;                // current HenOut, or null
  var wallet = null;              // {daily_amount, week_balance, streak}
  var feedLog = [];                // most-recent-first
  var deliveries = [];              // most-recent-first
  var activeTab = 'home';
  var authMode = 'login';            // 'login' | 'register'
  var obStep = 1;
  var draft = null;                   // onboarding draft, set fresh each time onboarding starts
  var demoOffset = 0;                  // local counter for the cumulative "advance day" offset
  var selDay = null;
  var actFilter = 'all';
  var stripeState = null;               // {stripe, elements} once a real Stripe form is mounted

  // farm-finder (onboarding step 1) - transient, re-asked fresh each time
  var geoStatus = 'idle';   // idle | asking | granted | denied | unsupported
  var farmRadius = 'all';   // 'all' | 10 | 25 | 50 (km) - filtered client-side once farms[] has distance_km

  function loadToken(){ try{ return localStorage.getItem(TOKEN_KEY); }catch(e){ return null; } }
  function saveToken(t){ try{ if(t){ localStorage.setItem(TOKEN_KEY, t); } else { localStorage.removeItem(TOKEN_KEY); } }catch(e){} }

  // ============ API helper ============
  // Relative paths ("/auth/login") only resolve to the right server when
  // this page is SERVED BY that server (the normal /app/ mount - browser
  // case). Bundled into a native app instead (mobile-app-real/), this page
  // is served from its own capacitor:// origin, so relative paths would
  // silently point at nothing. window.KVOC_API_BASE (see
  // mobile-app-real/www/config.js) is the one line that makes that case
  // point at your real deployed backend - see docs/DEPLOYMENT.md.
  var API_BASE = (typeof window.KVOC_API_BASE === 'string') ? window.KVOC_API_BASE : '';

  function ApiError(message, status){ this.message = message; this.status = status; }
  ApiError.prototype = Object.create(Error.prototype);

  function api(path, opts){
    opts = opts || {};
    var headers = Object.assign({}, opts.headers || {});
    if (opts.body !== undefined) headers['Content-Type'] = 'application/json';
    if (token) headers['Authorization'] = 'Bearer ' + token;
    return fetch(API_BASE + path, Object.assign({method:'GET'}, opts, {headers: headers})).then(function(res){
      return res.text().then(function(text){
        var data = {};
        try{ data = text ? JSON.parse(text) : {}; }catch(e){}
        if (res.status === 401) {
          doLogout();
          throw new ApiError('přihlášení vypršelo', 401);
        }
        if (!res.ok) throw new ApiError(data.detail || res.statusText || ('chyba '+res.status), res.status);
        return data;
      });
    });
  }

  function login(email, password){
    var body = new URLSearchParams();
    body.set('username', email);
    body.set('password', password);
    return fetch(API_BASE + '/auth/login', {
      method:'POST',
      headers:{'Content-Type':'application/x-www-form-urlencoded'},
      body: body.toString(),
    }).then(function(res){
      return res.text().then(function(text){
        var data = {}; try{ data = text?JSON.parse(text):{}; }catch(e){}
        if (!res.ok) throw new ApiError(data.detail || 'špatný email nebo heslo', res.status);
        return data;
      });
    });
  }

  // ============ date helpers ============
  function pad(n){ return n<10 ? '0'+n : ''+n; }
  function dateKey(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
  function getNow(){ return new Date(Date.now() + demoOffset*86400000); }
  function dateOnly(d){ return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
  function mondayOf(d){
    var g=d.getDay(); var diff=(g===0)?-6:(1-g);
    var m=dateOnly(d); m.setDate(m.getDate()+diff); return m;
  }
  function fmtDateHuman(key){
    var parts=key.split('-'); return parts[2]+'.'+parts[1]+'.';
  }
  function fmtFull(d){
    var days=['neděle','pondělí','úterý','středa','čtvrtek','pátek','sobota'];
    return days[d.getDay()]+' '+d.getDate()+'.'+(d.getMonth()+1)+'.';
  }
  function eggsPreview(amount){ return Math.max(1, Math.round(amount*5/12.5)); }
  function farmName(key){
    var f = farms.filter(function(x){ return x.key===key; })[0];
    return f ? f.name+' · '+f.description.split('·')[0].trim() : '';
  }

  // infer how many demo days have already been advanced by looking at the
  // most recent date we actually have data for, so a page reload doesn't
  // silently snap back to "today" while the server's data is further ahead
  function inferDemoOffset(){
    var maxDate = null;
    feedLog.concat(deliveries).forEach(function(e){ if(!maxDate || e.date > maxDate) maxDate = e.date; });
    if (!maxDate) { demoOffset = 0; return; }
    var real = dateOnly(new Date());
    var known = new Date(maxDate+'T00:00:00');
    var diff = Math.round((dateOnly(known) - real) / 86400000);
    demoOffset = Math.max(0, diff);
  }

  // ============ toasts ============
  var toastQueue = [];
  var toastBusy = false;
  function showToasts(list){ toastQueue = toastQueue.concat(list); pumpToasts(); }
  function pumpToasts(){
    if(toastBusy || !toastQueue.length) return;
    toastBusy = true;
    var t = toastQueue.shift();
    var host = document.getElementById('toast-host');
    var el = document.createElement('div');
    el.className = 'toast' + (t.err ? ' err' : '');
    el.innerHTML = '<span class="t-tag mono">'+escapeHtml(t.tag)+'</span><span class="t-body">'+escapeHtml(t.body)+'</span>';
    host.appendChild(el);
    requestAnimationFrame(function(){ requestAnimationFrame(function(){ el.classList.add('in'); }); });
    setTimeout(function(){
      el.classList.remove('in');
      setTimeout(function(){
        if(el.parentNode) el.parentNode.removeChild(el);
        toastBusy = false;
        pumpToasts();
      }, 320);
    }, 3800);

    if (!t.err && ('Notification' in window)) {
      try{ if (Notification.permission==='granted') new Notification('Kvoč · '+t.tag, {body:t.body}); }catch(e){}
    }
  }
  function toastError(err){ showToasts([{tag:'CHYBA', body: (err && err.message) || String(err), err:true}]); }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  // ============ icons ============

  // ============ farm-finder: real device location, real backend distances ============
  // Same idea as the offline demo's requestLocation(), but the distance math
  // happens server-side (GET /farms?lat=&lng=) since farms are real server
  // data here, not a hardcoded client array - one source of truth for it.
  function requestLocation(){
    geoStatus = 'asking';
    renderOnboarding();
    var GeoPlugin = (window.Capacitor && Capacitor.isNativePlatform && Capacitor.isNativePlatform() && Capacitor.Plugins)
      ? Capacitor.Plugins.Geolocation : null;

    function onOk(lat, lng){
      api('/farms?lat='+encodeURIComponent(lat)+'&lng='+encodeURIComponent(lng)).then(function(f){
        farms = f;
        geoStatus = 'granted';
        renderOnboarding();
      }).catch(function(){ geoStatus = 'denied'; renderOnboarding(); });
    }
    function onErr(){ geoStatus = 'denied'; renderOnboarding(); }

    if (GeoPlugin) {
      GeoPlugin.checkPermissions().then(function(perm){
        var already = perm && (perm.location === 'granted' || perm.coarseLocation === 'granted');
        return already ? Promise.resolve() : GeoPlugin.requestPermissions();
      }).then(function(){
        return GeoPlugin.getCurrentPosition({enableHighAccuracy:false, timeout:10000});
      }).then(function(pos){ onOk(pos.coords.latitude, pos.coords.longitude); }).catch(onErr);
    } else if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(function(pos){
        onOk(pos.coords.latitude, pos.coords.longitude);
      }, onErr, {enableHighAccuracy:false, timeout:10000});
    } else {
      geoStatus = 'unsupported';
      renderOnboarding();
    }
  }
  function farmsForPicker(){
    if (farmRadius==='all' || geoStatus!=='granted') return farms;
    return farms.filter(function(f){ return f.distance_km!=null && f.distance_km<=farmRadius; });
  }

  // ============ render: home ============
  function renderHome(){
    var today = getNow();
    var mon = mondayOf(today);
    var todayKey = dateKey(today);
    var days = [];
    for(var i=0;i<5;i++){
      var dd = new Date(mon.getTime()+i*86400000);
      var key = dateKey(dd);
      var fed = feedLog.some(function(e){ return e.date===key && !e.is_bonus; });
      days.push({key:key, label:DAY_LABELS[dd.getDay()], fed:fed, today:key===todayKey});
    }
    if(!selDay || days.every(function(d){return d.key!==selDay;})){ selDay = todayKey; }
    var selDayObj = days.filter(function(d){return d.key===selDay;})[0] || days[0];
    var selEntry = feedLog.filter(function(e){ return e.date===selDayObj.key && !e.is_bonus; })[0];
    var msg, amountLbl;
    if(selEntry){ msg = selEntry.message; amountLbl = '−'+selEntry.amount+' Kč'; }
    else if(selDayObj.key === todayKey && hen.paused){ msg = 'Dnes je appka pozastavená — '+hen.hen_name+' se dnes nekrmila.'; amountLbl='—'; }
    else if(selDayObj.key < todayKey){ msg = 'Tenhle den se '+hen.hen_name+' nenakrmila — appka buď ještě neběžela, nebo byla pozastavená.'; amountLbl='—'; }
    else { msg = 'Tenhle den ještě nenastal.'; amountLbl='—'; }

    var dayChips = days.map(function(d){
      return '<div class="day-chip pressable" data-action="select-home-day" data-day="'+d.key+'" data-fed="'+d.fed+'" data-today="'+d.today+'" data-selected="'+(d.key===selDayObj.key)+'">'+
        '<span class="mono">'+d.label+'</span><span class="dot"></span></div>';
    }).join('');

    var deliveryHtml = '';
    if(deliveries.length){
      var last = deliveries[0]; // API returns most-recent-first
      deliveryHtml =
        '<div class="card">'+
          '<div class="app-eyebrow">Pátek '+fmtDateHuman(last.date)+'</div>'+
          '<div class="egg-summary-num" style="margin-top:6px;"><span class="n">'+last.eggs+'</span><span class="u">vajec</span></div>'+
          '<div class="app-sub">z tvého příspěvku '+last.amount+' Kč za ten týden</div>'+
          '<div class="stepper">'+
            step('ready','PŘIPRAVENO',true)+
            step('transit','NA CESTĚ',true)+
            step('delivered','DORUČENO',last.status==='delivered')+
          '</div>'+
        '</div>';
    }

    var host = document.getElementById('main-content');
    host.innerHTML =
      '<div class="topbar"><div><div class="app-eyebrow">'+greeting()+'</div><div class="app-h1" style="font-size:23px;margin-top:2px;">'+escapeHtml(me.email.split('@')[0])+'</div></div>'+
        '<div class="avatar">'+ICO.egg+'</div></div>'+
      '<div class="card hen-card">'+ICO.hen+'<div class="hen-name">'+escapeHtml(hen.hen_name)+'</div>'+
        '<div class="hen-meta">'+escapeHtml(farmName(farmKeyOf(hen.farm_id)))+'</div></div>'+
      '<div><div class="field-label">Tento týden</div><div class="day-row">'+dayChips+'</div></div>'+
      '<div class="reveal-panel"><div class="reveal-top"><span>'+selDayObj.label+' '+fmtDateHuman(selDayObj.key)+'</span><span>'+amountLbl+'</span></div>'+
        '<div class="reveal-msg">'+escapeHtml(msg)+'</div></div>'+
      '<div class="stat-row">'+
        '<div class="stat-tile"><div class="label">Zůstatek k pátku</div><div class="value">'+wallet.week_balance+' Kč</div></div>'+
        '<div class="stat-tile"><div class="label">Série</div><div class="value">'+wallet.streak+' dní</div></div>'+

  function step(key,label,reached){
    return '<div class="step" data-reached="'+reached+'"><div class="step-track">'+
      '<div class="step-line'+(key==='ready'?' first':'')+'"></div><div class="step-dot"></div>'+

  function greeting(){
    var h = getNow().getHours();
    if(h<11) return 'Dobré ráno';
    if(h<18) return 'Dobré odpoledne';
    return 'Dobrý večer';
  }
  function farmKeyOf(farmId){
    var f = farms.filter(function(x){ return x.id===farmId; })[0];
    return f ? f.key : null;
  }

  // ============ render: activity ============
  function renderActivity(){
    var entries = [];
    feedLog.forEach(function(e){
      entries.push({when:e.date, type: e.is_bonus?'bonus':'feed', msg:e.message, tag: e.is_bonus?'BONUS':('−'+e.amount+' Kč'), sortKey: e.date+(e.is_bonus?'-bonus':'')});
    });
    deliveries.forEach(function(d){
      entries.push({when:d.date, type:'summary', msg:'Ten týden jsi '+hen.hen_name+' krmil za '+d.amount+' Kč. '+(d.status==='delivered'?'Vejce ('+d.eggs+') už dorazila.':'Dnes odpoledne dorazí '+d.eggs+' vajec.'), tag: d.status==='delivered'?'DORUČENO':'SOUHRN', sortKey: d.date+'-z'});
    });
    entries.sort(function(a,b){ return a.sortKey < b.sortKey ? 1 : -1; });
    entries = entries.slice(0,20);

    var visible = entries.filter(function(e){
      if(actFilter==='all') return true;
      if(actFilter==='feed') return e.type==='feed';
      return e.type==='bonus' || e.type==='summary';
    });

    var list = visible.length ? visible.map(function(e){
      return '<div class="stub" data-type="'+e.type+'"><span class="when mono">'+fmtDateHuman(e.when)+'</span>'+
        '<span class="msg">'+escapeHtml(e.msg)+'</span><span class="tag">'+escapeHtml(e.tag)+'</span></div>';
    }).join('') : '<div class="empty-note">Zatím žádná aktivita v tomhle filtru.</div>';

    var filters = [['all','Vše'],['feed','Krmení'],['bonus','Souhrny']].map(function(f){
      return '<div class="pill pressable" data-action="filter" data-filter="'+f[0]+'" data-active="'+(actFilter===f[0])+'">'+f[1]+'</div>';
    }).join('');

    document.getElementById('main-content').innerHTML =
      '<div><div class="app-eyebrow">Historie</div><div class="app-h1" style="margin-top:2px;">Aktivita</div></div>'+
      '<div class="pill-row">'+filters+'</div>'+
      '<div class="stub-list">'+list+'</div>';
  }

      '<div class="demo-box">'+
        '<div class="app-eyebrow">Demo nástroje</div>'+
        '<div class="center-mono" style="margin-top:8px;">simulované dnes: '+fmtFull(getNow())+'</div>'+
        '<div class="pressable" data-action="advance-day" style="margin-top:10px;"><div class="btn-primary" style="background:var(--ink-soft);font-size:13px;padding:11px;">Posunout o den →</div></div>'+
        '<div class="pressable" data-action="logout"><div class="btn-secondary">Odhlásit se</div></div>'+
      '</div>';
  }

  function renderPaymentSection(){
    if (me.has_saved_payment_method) {
      return '<div class="card">'+
        '<div class="field-label">Platba</div>'+
        '<div style="display:flex;align-items:center;gap:8px;">'+
          '<div style="color:var(--sage);flex-shrink:0;">'+ICO.check+'</div>'+
          '<div style="font-size:13.5px;">Platební metoda uložena</div>'+
        '</div>'+
        '<div class="field-label" style="margin-top:16px;">Dobít peněženku</div>'+
        '<div style="display:flex;gap:8px;margin-top:2px;">'+
          '<input class="text-input" id="topup-amount" type="number" min="10" max="5000" step="10" value="100" style="flex:1;">'+
          '<div class="pressable" data-action="topup"><div class="btn-primary" style="padding:0 16px;font-size:13px;white-space:nowrap;height:44px;">Dobít</div></div>'+
        '</div>'+
      '</div>';
    }
    return '<div class="card">'+
      '<div class="field-label">Platba</div>'+
      '<div class="app-sub">Zatím bez uložené platební metody.</div>'+
      '<div class="pressable" data-action="start-card-setup" style="margin-top:10px;"><div class="btn-primary" style="font-size:13.5px;padding:12px;">Přidat platební metodu</div></div>'+
      '<div id="stripe-mount" style="margin-top:12px;"></div>'+
    '</div>';
  }

  // ============ Stripe (loaded only when actually needed) ============
  function loadStripeJs(){
    if (window.Stripe) return Promise.resolve();
    return new Promise(function(resolve, reject){
      var s = document.createElement('script');
      s.src = 'https://js.stripe.com/v3/';
      s.onload = function(){ resolve(); };
      s.onerror = function(){ reject(new Error('Stripe.js se nepodařilo načíst')); };
      document.head.appendChild(s);
    });
  }
  function mountStripeCardForm(clientSecret, publishableKey){
    var mountEl = document.getElementById('stripe-mount');
    if (!mountEl) return;
    mountEl.innerHTML = '<div class="center-mono">Načítám platební formulář…</div>';
    loadStripeJs().then(function(){
      var stripe = Stripe(publishableKey);
      var elements = stripe.elements({clientSecret: clientSecret});
      mountEl.innerHTML = '<div id="stripe-payment-element"></div>'+
        '<div class="pressable" data-action="confirm-card-setup" style="margin-top:10px;"><div class="btn-primary" style="font-size:13px;padding:11px;">Uložit kartu</div></div>';
      elements.create('payment').mount('#stripe-payment-element');
      stripeState = {stripe:stripe, elements:elements};
    }).catch(toastError);
  }

  // ============ tab bar ============
  function renderTabbar(){
    var tabs = [['home','Domů',ICO.home],['activity','Aktivita',ICO.list],['settings','Nastavení',ICO.sliders]];
    document.getElementById('tabbar').innerHTML = tabs.map(function(t){
      var active = activeTab===t[0];
      return '<div class="tab pressable" data-action="tab" data-tab="'+t[0]+'" data-active="'+active+'">'+
        '<div class="tab-mark"></div>'+t[2]+'<span class="tab-label">'+t[1]+'</span></div>';
    }).join('');
  }

  function renderMain(){
    showView('main');
    if(activeTab==='home') renderHome();
    else if(activeTab==='activity') renderActivity();
    else renderSettings();
    renderTabbar();
  }

  // ============ data loading ============
  function loadHenData(){
    return Promise.all([
      api('/hens/'+hen.id+'/wallet'),
      api('/hens/'+hen.id+'/feed-log'),
      api('/hens/'+hen.id+'/deliveries'),
    ]).then(function(r){ wallet=r[0]; feedLog=r[1]; deliveries=r[2]; });
  }

  function loadHenDataAndDiffToasts(){
    var oldFeedIds = {}; feedLog.forEach(function(e){ oldFeedIds[e.id]=true; });
    var oldDeliveryStatus = {}; deliveries.forEach(function(d){ oldDeliveryStatus[d.id]=d.status; });
    return loadHenData().then(function(){
      var toasts = [];
      feedLog.forEach(function(e){
        if(!oldFeedIds[e.id]) toasts.push({tag: e.is_bonus?'BONUS':('−'+e.amount+' Kč'), body: e.message});
      });
      deliveries.forEach(function(d){
        if(oldDeliveryStatus[d.id]===undefined){
          toasts.push({tag:'PÁTEK', body:'Tenhle týden jsi '+hen.hen_name+' krmil. Dnes odpoledne dorazí '+d.eggs+' vajec.'});
        } else if(oldDeliveryStatus[d.id]==='transit' && d.status==='delivered'){
          toasts.push({tag:'DORUČENO', body:d.eggs+' vajec právě dorazilo ke dveřím.'});
        }
      });
      if(toasts.length) showToasts(toasts);
    });
  }

  // ============ push notifications ============
  // Only does anything inside the native app shell (Capacitor) with the
  // push-notifications plugin actually built in - a plain browser tab (this
  // same file, opened directly) just skips all of this, no error. See
  // docs/NOTIFICATIONS.md for how the backend side (FCM) gets configured.
  function registerPushIfNative(){
    if (!(window.Capacitor && Capacitor.isNativePlatform && Capacitor.isNativePlatform())) return;
    var Push = Capacitor.Plugins && Capacitor.Plugins.PushNotifications;
    if (!Push) return;

    Push.requestPermissions().then(function(res){
      if (res.receive !== 'granted') return;
      return Push.register();
    }).catch(function(){});

    Push.addListener('registration', function(tokenInfo){
      api('/auth/device-token', {method:'POST', body: JSON.stringify({fcm_token: tokenInfo.value})}).catch(function(){});
    });
    Push.addListener('registrationError', function(err){
      console.error('push registration failed', err);
    });
    Push.addListener('pushNotificationReceived', function(notification){
      // app was open in the foreground when the push arrived - the OS tray
      // won't show it in that case, so surface it the same way as every
      // other in-app notice instead of silently dropping it
      showToasts([{tag: (notification.title||'Kvoč').replace(/^Kvoč\s*·\s*/,''), body: notification.body||''}]);
    });
  }

  // ============ boot / auth flow ============
  function boot(){
    token = loadToken();
    if(!token){ authMode='login'; renderAuth(); showView('auth'); return; }
    api('/auth/me').then(function(m){
      me = m;
      registerPushIfNative();
      return api('/farms');
    }).then(function(f){
      farms = f;
      return api('/hens');
    }).then(function(hens){
      if(hens.length){
        hen = hens[0];
        return loadHenData().then(function(){ inferDemoOffset(); renderMain(); });
      }
      startOnboarding();
    }).catch(function(err){
      // any failure here must still leave something visible on screen -
      // an expired token and an unreachable backend need different messages,
      // but both need *a* rendered view, never a silently blank page
      var msg = '';
      if (err instanceof ApiError && err.status === 401) {
        msg = 'Přihlášení vypršelo — přihlas se znovu.';
      } else if (token) {
        msg = 'Nepodařilo se spojit s backendem. Běží spuštěný na stejné adrese, ze které je appka otevřená?';
      }
      token = null; saveToken(null);
      authMode = 'login';
      renderAuth(msg);
      showView('auth');
    });
  }

  function startOnboarding(){
    draft = {henName:'Nuška', farmKey: farms.length?farms[0].key:null, dailyAmount:20, address:''};
    obStep = 1;
    showView('onboarding');
    renderOnboarding();
  }

  function doLogout(){
    // best-effort, and must happen *before* token is cleared below - this
    // is an authenticated call, and its whole point is making sure this
    // device stops getting pushes meant for whoever logs in here next
    if (window.Capacitor && Capacitor.isNativePlatform && Capacitor.isNativePlatform() && token) {
      api('/auth/device-token', {method:'POST', body: JSON.stringify({fcm_token: ''})}).catch(function(){});
    }
    saveToken(null); token=null; me=null; hen=null; wallet=null; feedLog=[]; deliveries=[];
    authMode='login'; renderAuth(); showView('auth');
  }

  // ============ events (delegated) ============
  document.addEventListener('click', function(e){
    var el = e.target.closest('[data-action]');
    if(!el) return;
    var action = el.getAttribute('data-action');

    // --- auth ---
    if(action==='auth-toggle'){ authMode = authMode==='login' ? 'register' : 'login'; renderAuth(); }
    else if(action==='auth-submit'){
      var email = (document.getElementById('auth-email').value||'').trim();
      var password = document.getElementById('auth-password').value||'';
      if(!email || !password){ renderAuth('Vyplň email i heslo.'); return; }
      var btn = document.getElementById('auth-submit-btn');
      if(btn) btn.classList.add('busy');
      var call = authMode==='login' ? login(email, password) : api('/auth/register', {method:'POST', body: JSON.stringify({email:email, password:password})});
      call.then(function(res){
        saveToken(res.access_token); token = res.access_token;
        boot();
      }).catch(function(err){ renderAuth(err.message); });
    }

    // --- onboarding ---
    else if(action==='select-farm'){ draft.farmKey = el.getAttribute('data-farm'); renderOnboarding(); }
    else if(action==='geo-request'){ requestLocation(); }
    else if(action==='farm-radius'){
      var r = el.getAttribute('data-radius');
      farmRadius = r==='all' ? 'all' : Number(r);
      renderOnboarding();
    }
    else if(action==='onb-next'){
      var nameEl = document.getElementById('ob-name');
      draft.henName = (nameEl && nameEl.value.trim()) || draft.henName || 'Nuška';
      obStep = 2; renderOnboarding();
    }
    else if(action==='onb-back'){ obStep = 1; renderOnboarding(); }
    else if(action==='day-pill'){
      var hint = document.getElementById('ob-hint');
      if(hint && el.getAttribute('data-active')!=='true'){ hint.textContent = 'Zatím jde vybrat jen pátek — víc dní zvažujeme do budoucna.'; }
    }
    else if(action==='onb-finish'){
      var addrEl = document.getElementById('ob-address');
      if(addrEl) draft.address = addrEl.value.trim();
      if(!draft.farmKey){ return; }
      api('/hens', {method:'POST', body: JSON.stringify({hen_name:draft.henName, farm_key:draft.farmKey, daily_amount:draft.dailyAmount, address:draft.address})})
        .then(function(h){ hen = h; selDay=null; return loadHenData(); })
        .then(function(){ inferDemoOffset(); renderMain(); })
        .catch(toastError);
    }

    // --- main nav ---
    else if(action==='tab'){ activeTab = el.getAttribute('data-tab'); renderMain(); }
    else if(action==='select-home-day'){ selDay = el.getAttribute('data-day'); renderHome(); }
    else if(action==='filter'){ actFilter = el.getAttribute('data-filter'); renderActivity(); }
    else if(action==='logout'){ doLogout(); }

    // --- settings ---
    else if(action==='amount-minus' || action==='amount-plus'){
      var next = action==='amount-minus' ? Math.max(10, hen.daily_amount-5) : Math.min(40, hen.daily_amount+5);
      api('/hens/'+hen.id, {method:'PATCH', body: JSON.stringify({daily_amount: next})})
        .then(function(h){ hen = h; renderSettings(); }).catch(toastError);
    }
    else if(action==='toggle-pause'){
      api('/hens/'+hen.id, {method:'PATCH', body: JSON.stringify({paused: !hen.paused})})
        .then(function(h){ hen = h; return loadHenData(); }).then(function(){ renderSettings(); }).catch(toastError);
    }
    else if(action==='advance-day'){
      demoOffset += 1;
      api('/admin/run-tick?days_offset='+demoOffset, {method:'POST'})
        .then(function(){ return loadHenDataAndDiffToasts(); })
        .then(function(){ renderMain(); }).catch(toastError);
    }
    else if(action==='request-notif'){
      if('Notification' in window){
        try{ Notification.requestPermission().then(function(){ renderSettings(); }); }catch(e){ renderSettings(); }
      } else { renderSettings(); }
    }

    // --- payments ---
    else if(action==='start-card-setup'){
      api('/hens/'+hen.id+'/wallet/setup-intent', {method:'POST'}).then(function(res){
        if(res.publishable_key === 'mock-publishable-key'){
          return api('/auth/me').then(function(m){
            me = m; renderSettings();
            showToasts([{tag:'MOCK', body:'Platební metoda "uložena" (mock režim — žádná skutečná karta se nikam neposlala).'}]);
          });
        }
        mountStripeCardForm(res.client_secret, res.publishable_key);
      }).catch(toastError);
    }
    else if(action==='confirm-card-setup'){
      if(!stripeState) return;
      stripeState.stripe.confirmSetup({elements: stripeState.elements, redirect:'if_required'}).then(function(res){
        if(res.error){ toastError(res.error); return; }
        return api('/auth/me').then(function(m){
          me = m; renderSettings();
          showToasts([{tag:'ULOŽENO', body:'Karta uložena.'}]);
        });
      });
    }
    else if(action==='topup'){
      var amtEl = document.getElementById('topup-amount');
      var amt = Number(amtEl && amtEl.value);
      if(!amt || amt<=0) return;
      api('/hens/'+hen.id+'/wallet/topup', {method:'POST', body: JSON.stringify({amount_czk: amt})})
        .then(function(t){ showToasts([{tag:'DOBITO', body:'Dobito '+t.amount_czk+' Kč ('+t.provider+' režim).'}]); })
        .catch(toastError);
    }
  });

  document.addEventListener('input', function(e){
    if(e.target.id==='ob-range'){
      var amt = Number(e.target.value);
      document.getElementById('ob-amount-num').textContent = amt;
      document.getElementById('ob-weekly').textContent = amt*5;
      document.getElementById('ob-eggs').textContent = eggsPreview(amt);
      draft.dailyAmount = amt;
    }
  });

  boot();
})();
</script>
</body>
</html>
